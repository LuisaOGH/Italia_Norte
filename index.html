const D=[{"n":1,"t":"Bérgamo Alta","e":"🏰","q":"Bergamo Città Alta","s":720,"h":{"Bergamo":[45.7036,9.66]},"items":[{"k":"T","id":"d1x1","n":"Bergamo","q":"Bergamo città","a":"Dos ciudades en una: la Città Alta medieval amurallada y la Città Bassa moderna","b":"Unos 120.000 habitantes. La Città Alta, sobre una colina rodeada de murallas venecianas (UNESCO), se recorre a pie en una tarde. Se sube en funicular desde la Città Bassa.","x":"Fundada por los celtas y romanizada con el nombre de Bergomum, Bérgamo vivió siglos bajo la República de Venecia (1428–1797), que levantó sus murallas. Es tierra de Donizetti y de buena cocina: polenta, casoncelli y stracciatella."},{"k":"R","id":"d1r3","e":"✈️","n":"Sevilla → Aeropuerto de Milán-Bérgamo (BGY)","d":0,"km":0,"at":0,"x":"Vuelo de Sevilla (SVQ) a Milán-Bérgamo, en Orio al Serio, a unos 5 km del centro histórico de Bérgamo. Aterrizaje previsto hacia las 12:00. Llevad documentación a mano y revisad la terminal en la tarjeta de embarque.","tm":"Mañana","g":""},{"k":"R","id":"d1r4","e":"🚕","n":"Taxi BGY → Via Mario Lupo 6 (Bérgamo Alta)","d":30,"km":6,"at":0,"x":"Taxi desde el aeropuerto hasta el alojamiento en Via Mario Lupo 6, en la Città Alta (~25–35 € en total, ~20–30 min). Después, check-in y dejar maletas.","tm":"","g":""},{"k":"S","id":"d1x5","n":"Via Mario Lupo","z":"Bergamo","p":[45.7036,9.66],"d":30,"q":"Via Mario Lupo Bergamo","a":"Calle residencial histórica patricia con fachadas sobrias de piedra y arcadas barrocas.","b":"Calle de la Città Alta donde está vuestro alojamiento (nº 6), a un paso de Via Gombito y de la torre.","x":"Una de las calles del eje histórico de la Città Alta, entre casas señoriales de piedra. Su posición central permite hacer casi todo a pie desde el alojamiento.","g":"","s0":0,"o":0},{"k":"S","id":"d1x6","n":"Via Gombito","z":"Bergamo","p":[45.7041,9.6604],"d":5,"q":"Via Gombito Bergamo","a":"Antiguo Decumanus Maximus romano que conserva el trazado medieval con comercios tradicionales.","b":"Antiguo Decumanus Maximus romano. Pizza al taglio ~10 €/p.","x":"Heredera del cardo romano, esta calle une la Città Alta con la Piazza Vecchia. Conserva soportales y tiendas de siempre, y en ella se prueban los dulces típicos de Bérgamo.","g":"","s0":0,"o":0},{"k":"M","id":"d1x7","n":"Almuerzo: Pizza al taglio","e":"🍽️","d":40,"at":0,"a":"Pizza al taglio / Sugerencia: Nessy Cittá Alta"},{"k":"S","id":"d1x8","n":"Torre del Gombito","z":"Bergamo","p":[45.7037,9.6598],"d":10,"q":"Torre del Gombito Bergamo","a":"Torre defensiva de piedra de 52 metros del siglo XI, símbolo del poder nobiliario.","b":"Torre defensiva del s. XI, 52 m. Fachada gratis; terraza con reserva en la oficina de turismo.","x":"Construida en el siglo XI como torre de vigilancia de una familia noble, mide 52 m y es una de las torres medievales mejor conservadas de la Città Alta. Su silueta marca el eje de Via Gombito, la antigua calle mayor romana.","g":"","s0":0,"o":0},{"k":"S","id":"d1x9","n":"Piazza Vecchia","z":"Bergamo","p":[45.7042,9.6612],"d":15,"q":"Piazza Vecchia Bergamo","a":"Salón urbano monumental renacentista valorado por Le Corbusier.","b":"Plaza porticada y peatonal del casco antiguo. Mejor a primera hora o con la luz de la tarde.","x":"Rodeada por el Palazzo della Ragione, la Torre Civica, el Palazzo Nuovo (hoy biblioteca) y la fuente Contarini, es el salón de la ciudad. Le Corbusier la elogió como una de las plazas más bellas de Europa.","g":"","s0":0,"o":0},{"k":"S","id":"d1x10","n":"Palazzo della Ragione","z":"Bergamo","p":[45.7041,9.661],"d":20,"q":"Palazzo della Ragione Bergamo","a":"Ayuntamiento comunal del siglo XII con arcos ojivales, León de San Marcos y meridiano solar.","b":"Ayuntamiento más antiguo de Lombardía (s. XII). León de San Marcos y meridiano solar. Pórtico libre; sala ~5 €.","x":"El edificio civil más antiguo de Lombardía, del siglo XII, fue sede de la justicia y del gobierno comunal. En el suelo del pórtico está el meridiano solar de 1798 y en la fachada el león alado de San Marcos recuerda el dominio veneciano.","g":"","s0":0,"o":0},{"k":"S","id":"d1x11","n":"Il Campanone (Torre Cívica)","z":"Bergamo","p":[45.7043,9.6613],"d":25,"q":"Il Campanone Bergamo","a":"Torre de 52 metros con la campana más grande de Lombardía que repica 100 veces a las 22:00h.","b":"Torre de 52 m con la campana mayor de Lombardía: suena 100 veces cada noche a las 22:00. ~5 € con museo. Junto a la Fontana Contarini (1780).","x":"Torre del siglo XII que sigue haciendo sonar cada noche a las 22:00 un toque heredado del antiguo toque de queda. Se sube en ascensor y desde arriba se ve toda la Città Alta, la llanura del Po y, en días claros, los Alpes.","g":"","s0":0,"o":0},{"k":"S","id":"d1x12","n":"Fontana Contarini","z":"Bergamo","p":[45.7042,9.6611],"d":5,"q":"Fontana Contarini Bergamo","a":"Fuente ornamental de 1780 ubicada en el centro de la plaza, decorada con esfinges y leones.","b":"En el centro de la Piazza Vecchia, regalada a la ciudad en 1780. Libre.","x":"Fuente de mármol blanco donada por Alvise Contarini, podestà veneciano, en 1780. Los leones y esfinges que la decoran son muy fotografiados.","g":"","s0":0,"o":0},{"k":"S","id":"d1x13","n":"La Rocca di Bergamo","z":"Bergamo","p":[45.705,9.6683],"d":25,"q":"La Rocca di Bergamo Bergamo","a":"Fortaleza viscontea del siglo XIV hoy convertida en parque y museo","b":"Parque de la Rocca con miradores sobre la llanura. Contiene el museo de la historia de Bérgamo (consultad horario en el momento). Paseo tranquilo con mucha sombra.","x":"Levantada en 1331 por los Visconti de Milán sobre la colina de Sant'Eufemia, pasó después a manos venecianas y fue cuartel. Hoy es un parque con museo histórico y uno de los mejores miradores de la ciudad.","g":"","s0":0,"o":0},{"k":"S","id":"d1x14","n":"Piazza del Duomo","z":"Bergamo","p":[45.7035,9.6619],"d":5,"q":"Piazza del Duomo Bergamo","a":"Plaza monumental que concentra un deslumbrante patrimonio artístico.","b":"Plaza monumental pegada a la Piazza Vecchia: aquí se concentran el Duomo, Santa Maria Maggiore y la Capilla Colleoni.","x":"Reúne en pocos metros la catedral, la basílica y el mausoleo Colleoni: siglos de arte, del románico al Renacimiento.","g":"","s0":0,"o":0},{"k":"S","id":"d1x15","n":"Duomo di Bergamo","z":"Bergamo","p":[45.7034,9.662],"d":15,"q":"Duomo di Bergamo Bergamo","a":"Catedral dedicada a San Alejandro, con fachada neoclásica y gran cúpula","b":"Entrada libre (respetad los horarios de misa). Su fachada actual es del siglo XIX y su cúpula domina el perfil de la Città Alta.","x":"Dedicada a San Alejandro, patrón de Bérgamo, se levantó sobre templos anteriores. Está pegada a la Basílica de Santa Maria Maggiore y la Capilla Colleoni, formando el conjunto monumental de la plaza.","g":"","s0":0,"o":0},{"k":"S","id":"d1x16","n":"Basílica de Santa Maria Maggiore","z":"Bergamo","p":[45.7038,9.6622],"d":20,"q":"Basílica de Santa Maria Maggiore Bergamo","a":"Templo románico lombardo de 1137 con deslumbrante interior barroco y tumba de Donizetti.","b":"Románico lombardo por fuera, estuco y oro por dentro. Tumba de Donizetti. ~5 €.","x":"Iniciada en 1137, sorprende por su interior barroco cubierto de tapices, estucos y frescos que contrasta con la sobriedad románica del exterior. Aquí está la tumba del compositor Gaetano Donizetti, nacido en Bérgamo.","g":"","s0":0,"o":0},{"k":"S","id":"d1x17","n":"Capilla Colleoni","z":"Bergamo","p":[45.7036,9.662],"d":15,"q":"Capilla Colleoni Bergamo","a":"Mausoleo renacentista de Bartolomeo Colleoni con fachada geométrica en mármoles policromados.","b":"Mausoleo renacentista (1472–76) de mármol blanco, rojo y negro. Entrada gratis; cierra lunes.","x":"Construida entre 1472 y 1476 para el condotiero Bartolomeo Colleoni, que había servido a Venecia. Obra maestra del Renacimiento lombardo, con fachada de mármol polícromo y frescos de Tiepolo en el interior.","g":"","s0":0,"o":0},{"k":"S","id":"d1x18","n":"Palazzo Moroni","z":"Bergamo","p":[45.7055,9.6643],"d":35,"q":"Palazzo Moroni Bergamo","a":"Palacio barroco del siglo XVII con frescos, colección de arte y jardín en terrazas","b":"Palacio barroco del siglo XVII con frescos, colección de arte y jardín en terrazas. Vie–dom 10–18 h, ~10–12 €, reserva online.","x":"Palacio nobiliario del siglo XVII que conserva sus salones decorados, retratos de la familia Moroni y un jardín en terrazas con vistas a la Città Alta.","g":"","s0":0,"o":1},{"k":"S","id":"d1x19","n":"Colle Aperto y Porta San Alessandro","z":"Bergamo","p":[45.7053,9.654],"d":15,"q":"Colle Aperto Porta San Alessandro Bergamo","a":"Punto defensivo histórico que conectaba la muralla con el ascenso a la colina.","b":"Punto débil de la ciudad, blindado por Venecia. Subid andando 20 min o funicular (~1,70 €).","x":"Colle Aperto es la «colina abierta»: el único punto por el que la Città Alta era fácil de atacar. Los venecianos lo resolvieron en el siglo XVI con fosos, baluartes y la imponente Porta San Alessandro. Desde aquí sale el funicular a San Vigilio (~1,70 €) o un sendero de unos 20 minutos a pie.","g":"","s0":0,"o":0},{"k":"S","id":"d1x20","n":"Castello di San Vigilio","z":"Bergamo","p":[45.7091,9.6527],"d":40,"q":"Castello di San Vigilio Bergamo","a":"Fortaleza medieval y veneciana situada a 496m de altitud con panorámicas del horizonte alpino.","b":"A 496 m, el punto más alto de Bérgamo. Vistas a los Alpes y la llanura del Po: ¡el sitio del atardecer! Gratis, 08–20 h.","x":"Fortaleza medieval reformada por los venecianos, a 496 m de altitud. Del castillo quedan murallas y torres, pero lo importante son las vistas: el atardecer sobre la llanura lombarda es uno de los mejores de la ciudad. Se llega a pie o en funicular desde Colle Aperto.","g":"","s0":0,"o":0},{"k":"S","id":"d1x21","n":"Le Mura Veneziane","z":"Bergamo","p":[45.7003,9.6582],"d":15,"q":"Le Mura Veneziane Bergamo","a":"Murallas del siglo XVI declaradas Patrimonio de la Humanidad por la UNESCO con 14 baluartes.","b":"Murallas del s. XVI, 5 km y 14 baluartes. Paseo libre 24 h.","x":"Levantadas entre 1561 y 1588 para proteger Bérgamo, la ciudad más occidental de la República de Venecia, rodean la Città Alta a lo largo de más de 5 km con 14 baluartes y cuatro puertas. Desde 2017 son Patrimonio de la Humanidad (UNESCO). Hoy son un paseo libre a cualquier hora.","g":"","s0":0,"o":0},{"k":"S","id":"d1x22","n":"Porta San Giacomo","z":"Bergamo","p":[45.7,9.665],"d":5,"q":"Porta San Giacomo Bergamo","a":"La más monumental de las cuatro puertas de la muralla veneziana, con mármol claro y el león de San Marcos","b":"Una de las cuatro puertas de las murallas. Paseo libre 24 h.","x":"Terminada a finales del siglo XVI, presume de mármol blanco y de los emblemas de la República de Venecia. Marca la entrada sur de la Città Alta y el final natural del paseo por las murallas.","g":"","s0":0,"o":0},{"k":"M","id":"d1x23","n":"Cena: Casoncelli","e":"🍽️","d":90,"at":1200,"a":"sugerencia: Trattoria Da Mimmo"}]},{"n":2,"t":"Milán","e":"🏙️","q":"Milano Duomo","s":660,"h":{"Milano":[45.4651,9.1943]},"items":[{"k":"T","id":"d2x24","n":"Milán","q":"Milano città","a":"Capital moral y económica de Italia, donde la vanguardia dialoga con dos milenios de historia","b":"Segunda ciudad del país, con el Duomo como símbolo y barrios muy distintos entre sí. Para ir de uno a otro se usa metro o se camina.","x":"Milán es la capital moral y económica de Italia, una metrópoli donde la vanguardia contemporánea dialoga directamente con dos milenios de historia. Fundada por las tribus galas hacia el año 600 a.C. (*Mediolanum*, la \"ciudad en medio de la tierra\"), se convirtió en una de las capitales más prósperas del tardío **Imperio Romano**, lugar desde el cual el emperador Constantino promulgó el famoso Edicto de Milán en el año 313 d.C. legalizando el cristianismo. Durante la Edad Media y el Renacimiento, Milán estuvo dominada por dos grandes familias rivales que modelaron su fisonomía: los **Visconti** (quienes iniciaron la construcción del Duomo y proyectaron el poder militar de la serpiente *biscione*) y los **Sforza**, señores de la guerra que convirtieron la corte milanesa en un imán para los mayores genios de Europa, entre ellos **Leonardo da Vinci**. Tras siglos de dominio español y austriaco que aportaron sobriedad y elegancia neoclásica, Milán resurgió en el siglo XX como el epicentro de la moda, el diseño industrial y el dinamismo italiano."},{"k":"R","id":"d2r26","e":"🚆","n":"Tren Bérgamo → Milano Centrale","d":0,"km":55,"at":0,"x":"Bajada desde la Città Alta a la estación (funicular + paseo), con margen. El tren regional tarda ~1 h y llega a Milano Centrale hacia las 11:00. Billete en máquina o app; validad el billete si es de papel.","tm":"10:00 → 11:00","g":""},{"k":"R","id":"d2r27","e":"🚕","n":"Taxi Milano Centrale → Via San Paolo 13","d":30,"km":4,"at":0,"x":"Taxi desde la estación hasta el alojamiento (~12–18 € en total). Instalación y salida a pie.","tm":"","g":""},{"k":"S","id":"d2x28","n":"Via San Paolo","z":"Milano","p":[45.4651,9.1943],"d":20,"q":"Via San Paolo Milano","a":"Vía aristocrática neoclásica cercana al antiguo centro religioso de la ciudad.","b":"Calle neoclásica a pocos minutos del Duomo; aquí está vuestro alojamiento (nº 13).","x":"Calle tranquila del centro histórico de Milán, cerca de Corso Vittorio Emanuele II y de la plaza del Duomo, con palacios neoclásicos.","g":"","s0":0,"o":0},{"k":"S","id":"d2x29","n":"Corso Vittorio Emanuele II","z":"Milano","p":[45.4656,9.1935],"d":5,"q":"Corso Vittorio Emanuele II Milano","a":"Avenida peatonal vibrante comercial que conduce directamente hacia la catedral.","b":"Calle peatonal comercial entre San Babila y la plaza del Duomo, con grandes tiendas y cines.","x":"Es el eje comercial de Milán: una avenida peatonal que une San Babila con el Duomo, bordeada de tiendas, cafés y galerías.","g":"","s0":0,"o":0},{"k":"S","id":"d2x30","n":"Piazza del Duomo","z":"Milano","p":[45.4641,9.1919],"d":10,"q":"Piazza del Duomo Milano","a":"Gran plaza monumental y centro geométrico y emocional de la ciudad de Milán.","b":"Centro de la ciudad: el Duomo, la Galleria y el Palazzo Reale se abren a ella. Punto de encuentro de milaneses y turistas.","x":"Su aspecto actual se debe a reformas del siglo XIX. En el centro está el monumento a Víctor Manuel II y bajo ella se cruzan las líneas de metro M1 y M3.","g":"","s0":0,"o":0},{"k":"M","id":"d2lunch","n":"Almuerzo: panzerotti de Luini o pizza al taglio","e":"🍽️","d":30,"at":0,"a":"Via Radegonda 16, junto al Duomo (~8–10 €/p)."},{"k":"S","id":"d2x31","n":"Catedral de Milán (Duomo di Milano)","z":"Milano","p":[45.4642,9.1916],"d":75,"q":"Catedral de Milán Milano","a":"Catedral de gótico flamígero con 135 agujas, 3.400 estatuas y la icónica Madonnina.","b":"Gótico flamígero, 135 agujas y la Madonnina dorada. Empezó en 1386. 09–19 h, ~22 € combo, reserva online.","x":"Empezó a construirse en 1386 bajo los Visconti y tardó casi seis siglos en terminarse. Es de mármol de Candoglia, con 135 agujas y unas 3.400 estatuas, y en lo alto brilla la Madonnina dorada. Las terrazas permiten pasear entre las agujas.","g":"","s0":0,"o":0},{"k":"S","id":"d2x32","n":"Galleria Vittorio Emanuele II","z":"Milano","p":[45.4656,9.19],"d":20,"q":"Galleria Vittorio Emanuele II Milano","a":"Galería comercial del siglo XIX con imponente cúpula de hierro y cristal y el mosaico del toro.","b":"El salón de Milán (1865–77), cúpula de hierro y cristal. Dad 3 vueltas sobre el toro para la suerte. Libre.","x":"Inaugurada en 1867 y obra de Giuseppe Mengoni, une la plaza del Duomo con la Scala bajo una cúpula de hierro y cristal. En el suelo hay mosaicos con los emblemas de las ciudades; la tradición dice que girar sobre el toro da suerte.","g":"","s0":0,"o":0},{"k":"S","id":"d2x33","n":"Teatro alla Scala","z":"Milano","p":[45.4674,9.1895],"d":20,"q":"Teatro alla Scala Milano","a":"Templo mundial neoclásico de la ópera fundado en 1778.","b":"Templo mundial de la ópera (1778). Exterior libre; museo 10–18 h, ~12 €.","x":"Inaugurado en 1778 con proyecto de Piermarini, es uno de los teatros de ópera más prestigiosos del mundo. Aquí se estrenaron obras de Verdi y Puccini, y la temporada empieza cada 7 de diciembre.","g":"","s0":0,"o":0},{"k":"S","id":"d2x34","n":"Piazza Mercanti","z":"Milano","p":[45.4654,9.1869],"d":10,"q":"Piazza Mercanti Milano","a":"Corazón medieval de Milán, con el antiguo Palazzo della Ragione","b":"Plaza porticada del siglo XIII, antiguo centro cívico y comercial. Entrada libre, a un minuto del Duomo.","x":"Rodeada de la Loggia degli Osii, el Palazzo della Ragione y la Casa dei Panigarola, es el único rincón del Milán medieval que se conserva casi intacto, a pocos pasos de la plaza del Duomo.","g":"","s0":0,"o":0},{"k":"S","id":"d2x35","n":"Quadrilatero / Pinacoteca di Brera","z":"Milano","p":[45.472,9.188],"d":40,"q":"Quadrilatero / Pinacoteca di Brera Milano","a":"Barrio de la alta costura y la bohemia con la Pinacoteca di Brera (Rafael, Caravaggio, Mantegna)","b":"Barrio de la alta costura y la bohemia con la Pinacoteca di Brera (Rafael, Caravaggio, Mantegna). Pinacoteca ~15 €, con reserva previa.","x":"Las calles de Montenapoleone concentran la moda; Brera, vecino, es un barrio de callejones adoquinados y galerías. La Pinacoteca guarda obras maestras como el Cristo muerto de Mantegna y el Beso de Hayez.","g":"","s0":0,"o":1},{"k":"S","id":"d2x36","n":"Via Dante","z":"Milano","p":[45.4663,9.1856],"d":5,"q":"Via Dante Milano","a":"Paseo peatonal flanqueado por palacetes del siglo XIX que conecta con la fortaleza.","b":"Paseo peatonal entre el Duomo y el Castello Sforzesco, con terrazas y palacios del siglo XIX.","x":"Trazada a finales del siglo XIX, une el centro con el Castello y es una de las calles más agradables para caminar sin prisa.","g":"","s0":0,"o":0},{"k":"S","id":"d2x37","n":"Castello Sforzesco","z":"Milano","p":[45.4705,9.1795],"d":45,"q":"Castello Sforzesco Milano","a":"Fortaleza militar del siglo XV construida por los Visconti y Sforza, con la Torre del Filarete.","b":"Fortaleza de los Sforza donde trabajó Leonardo. Torre del Filarete. Patios gratis 07–19:30; museos ~5 €.","x":"Levantado por los Visconti en el siglo XIV y reconstruido por Francesco Sforza desde 1450, fue residencia ducal y cuartel. Hoy aloja museos, entre ellos la Pietà Rondanini de Miguel Ángel. La torre del Filarete es su icono.","g":"","s0":0,"o":0},{"k":"S","id":"d2x38","n":"Parco Sempione y Arco della Pace","z":"Milano","p":[45.4749,9.1717],"d":20,"q":"Parco Sempione Arco della Pace Milano","a":"Gran parque urbano de 38 hectáreas rematado por el arco de triunfo neoclásico.","b":"Pulmón verde que termina en el arco napoleónico.","x":"Parque público de unas 38 hectáreas, diseñado en el siglo XIX sobre la antigua plaza de armas del Castello. En su extremo se levanta el Arco della Pace, arco triunfal neoclásico terminado en 1838.","g":"","s0":0,"o":0},{"k":"S","id":"d2x39","n":"columnas de san lorenzo","z":"Milano","p":[45.4587,9.1822],"d":10,"q":"columnas de san lorenzo Milano","a":"Dieciséis columnas romanas del siglo II–III d.C. frente a la basílica de San Lorenzo","b":"Las Colonne di San Lorenzo, del siglo II–III d.C., son un resto del Milán imperial. Entrada libre; en las noches de verano se llenan de gente joven.","x":"Estas dieciséis columnas corintias son de las pocas estructuras romanas que se conservan en Milán. Se cree que formaban parte de un edificio de la época en que la ciudad fue capital imperial. Hoy son el centro de la movida y quedan frente a la Basílica de San Lorenzo Maggiore.","g":"","s0":0,"mt":[15,0.5,1.3],"o":0},{"k":"S","id":"d2x40","n":"Los Navigli (Naviglio Grande y Pavese)","z":"Milano","p":[45.4506,9.1735],"d":50,"q":"Los Navigli Milano","a":"Antiguos canales navegables convertidos en barrio de ocio","b":"Metro M2 Cadorna → Porta Genova (2,20 €). Ambiente especialmente bonito al atardecer, con terrazas junto al canal.","x":"Los Navigli fueron la red de canales de Milán. El Naviglio Grande, de origen medieval, llevó agua y mercancías, entre ellas el mármol del Duomo; a Leonardo da Vinci se le atribuyen mejoras en las esclusas. El Vicolo dei Lavandai conserva el antiguo lavadero de piedra.","g":"","s0":0,"o":0},{"k":"M","id":"d2x41","n":"Cena: Risotto a la milanese ó Cotoletta","e":"🍽️","d":90,"at":1200,"a":"sugerencia:"}]},{"n":3,"t":"Monza, Como y el lago","e":"⛵","q":"Lago di Como","s":540,"h":{"Como":[45.81,9.086]},"items":[{"k":"T","id":"d3x42","n":"Brianza","q":"Brianza","a":"Comarca al norte de Milán entre lagos y colinas, con villas y parques históricos","b":"La Brianza es la zona residencial y verde entre Milán y los lagos. Monza es su ciudad más conocida.","x":"Su paisaje de colinas con villas aristocráticas y parques fue refugio de la nobleza milanesa. Hoy une tradición industrial, deporte (Monza) y excursiones en bici."},{"k":"R","id":"d3r44","e":"🚗","n":"Milán → Monza (SS36)","d":40,"km":18,"at":0,"x":"Salida temprana (09:00): recogida del coche de alquiler en la Estación Central y trayecto rápido por la SS36 (~18 km). Aparcamiento cerca del centro histórico de Monza. Si vais justos de tiempo, esta parada se puede saltar con el botón «Quitar».","tm":"","g":""},{"k":"T","id":"d3x45","n":"Monza","q":"Monza città","a":"Ciudad lombarda famosa por su catedral con la Corona de Hierro y por el Autódromo","b":"A 18 km de Milán, con un centro histórico peatonal y un enorme parque real.","x":"Capital de la reina lombarda Teodolinda en el siglo VII, Monza conserva la Corona de Hierro en su catedral. Su Autódromo, dentro del Parque Real, es uno de los más míticos de la Fórmula 1."},{"k":"S","id":"d3x46","n":"Catedral de Monza (Duomo di Monza)","z":"Monza","p":[45.5845,9.2744],"d":20,"q":"Catedral de Monza Monza","a":"Joya del gótico lombardo en mármol blanco y verde donde se custodia la Corona de Hierro","b":"Parada opcional de 20–30 min. Entrada a la catedral gratuita; capilla de Teodolinda y museo de pago (consultad).","x":"Catedral gótica de los siglos XIII–XIV con fachada bicolor. Guarda la Corona de Hierro, con la que fueron coronados reyes de Italia. La capilla de Teodolinda conserva frescos del siglo XV.","g":"","s0":0,"o":1},{"k":"S","id":"d3x47","n":"Parque de Monza","z":"Monza","p":[45.585,9.2752],"d":10,"q":"Parque de Monza Monza","a":"Extenso parque histórico que alberga el legendario circuito de velocidad","b":"Con la Villa Reale y el Autodromo Nazionale, es uno de los mayores parques cerrados de Europa. Aquí solo hay tiempo para una pasada rápida en coche por la entrada, camino de la autopista.","x":"Rodeado por un muro de 14 km, el parque nació en el siglo XIX alrededor de la Villa Reale. Dentro, el Autódromo de Monza es sede histórica de la Fórmula 1.","g":"","s0":0,"o":1},{"k":"R","id":"d3r49","e":"🚗","n":"Monza → Como (SS36 / A9)","d":40,"km":38,"at":0,"x":"Salida de Monza hacia Como por la SS36 y A9 (~38 km, 40 min). Aparcad en el parking privado del hotel.","tm":"","g":""},{"k":"R","id":"d3r50","e":"🏨","n":"Check-in en el hotel de Como + paseo al embarcadero","d":35,"km":0,"at":0,"x":"Registro, dejar maletas y paseo a pie hasta el embarcadero de Piazza Cavour (unos 10 min).","tm":"","g":""},{"k":"T","id":"d3x51","n":"Lago di Como","q":"Lago di Como","a":"Uno de los lagos más bellos del mundo, con forma de Y invertida, rodeado de montañas y villas","b":"Más de 400 m de profundidad, pueblos de postal y ferries que unen las orillas. Aquí se mueve todo en barco.","x":"Excavado por un glaciar, el Lario es uno de los lagos más profundos de Europa. Sus orillas se llenaron de villas patricias desde la época romana; los ferries son la mejor forma de verlas."},{"k":"R","id":"d3r53","e":"⛴️","n":"BARCO: Como → Tremezzo (hidrofoil)","d":50,"km":25,"at":690,"x":"Desde el embarcadero de Piazza Cavour. Servicio Rápido (aliscafo) entre villas históricas, ~50 min. Billete ~14,80 €/p. Embarcad a las 11:30.","tm":"","g":""},{"k":"T","id":"d3x54","n":"Tremezzo","q":"Tremezzo città","a":"Pueblo de la «Riviera de las Azaleas», con la Villa Carlotta y su jardín botánico","b":"Embarcadero y villa a cinco minutos a pie. Un sitio muy tranquilo, ideal para comer junto al agua.","x":"Tremezzo ocupa la orilla occidental, frente a Bellagio, con vistas a las montañas. La Villa Carlotta es su joya: jardines botánicos y arte neoclásico."},{"k":"S","id":"d3x55","n":"Villa Carlotta (Tremezzo)","z":"Tremezzo","p":[45.9866,9.2252],"d":70,"q":"Villa Carlotta Tremezzo","a":"Residencia neoclásica en Tremezzo con obras de Canova y 8 hectáreas de jardín botánico.","b":"Villa neoclásica, 8 ha de jardines y esculturas de Canova. 10–19 h, ~15 € (~8 € adolescentes).","x":"Construida a finales del siglo XVII, debe su nombre a Carlota de Prusia, que la recibió como regalo de boda en 1850. Guarda esculturas neoclásicas de Canova y Thorvaldsen y un jardín botánico famoso por sus azaleas y rododendros.","g":"","s0":0,"o":0},{"k":"M","id":"d3x56","n":"Almuerzo: panini o focaccia","e":"🍽️","d":40,"at":0,"a":"sugerencia: muelle de tremezzo"},{"k":"S","id":"d3x57","n":"villa balbanello","z":"Tremezzo","p":[45.9883,9.2244],"d":100,"q":"villa balbanello Tremezzo","a":"Villa del XVIII en una península, escenario de películas","b":"Villa del XVIII en una península, escenario de películas. Incluye ida y vuelta en taxi acuático desde Tremezzo (~100 min en total). ~12 € de entrada, reserva imprescindible.","x":"Situada en la punta de Lavedo, cerca de Lenno, es una de las villas más fotografiadas del lago, con jardines escalonados y una loggia sobre el agua. Acceso en barco o a pie por un sendero.","g":"","s0":0,"bk":6,"o":1},{"k":"R","id":"d3r59","e":"⛴️","n":"BARCO: Tremezzo → Bellagio (ferry de cruce)","d":20,"km":5,"at":0,"x":"Ferry corto por el lago (~15–20 min, ~4,60 €/p). Comprobad horarios en el embarcadero, sobre todo si hacéis la visita opcional al Balbianello.","tm":"","g":""},{"k":"T","id":"d3x60","n":"Bellagio","q":"Bellagio città","a":"La «Perla del Lago», sobre el promontorio donde el lago se divide en dos brazos","b":"Calles empedradas y escalonadas, tiendas de seda y vistas espectaculares desde los jardines de Punta Spartivento.","x":"Bellagio ocupa la punta de la península que separa los brazos de Como y Lecco. Las escalinatas bajan hasta el agua entre casas de colores. Es uno de los pueblos más fotografiados del norte de Italia."},{"k":"S","id":"d3x61","n":"Salita Serbelloni","z":"Bellagio","p":[45.9867,9.2612],"d":25,"q":"Salita Serbelloni Bellagio","a":"Pintorescas escalinatas de piedra y callejones de la 'Perla del Lago'.","b":"Callejuelas con tiendas de seda y artesanía local. Se recorre en 20–30 min.","x":"Esta calle escalonada baja hasta el lago entre fachadas de colores. Aquí está la mejor muestra del comercio tradicional de Bellagio: seda, madera y cerámica.","g":"","s0":0,"o":0},{"k":"S","id":"d3x62","n":"Punta Spartivento","z":"Bellagio","p":[45.9825,9.265],"d":25,"q":"Punta Spartivento Bellagio","a":"Mirador panorámico situado en el extremo del promontorio donde se dividen los brazos del lago.","b":"Jardines públicos con vistas a los dos brazos del lago, el de Como y el de Lecco.","x":"En esta punta, Bellagio se asoma al lugar donde el lago de Como se divide en dos brazos, el de Como y el de Lecco. Es uno de los mejores atardeceres de la zona.","g":"","s0":0,"o":0},{"k":"R","id":"d3r64","e":"⛴️","n":"BARCO: Bellagio → Como (aliscafo)","d":55,"km":28,"at":1050,"x":"Barco rápido (aliscafo / hidrodeslizador) a las 17:30, ~55 min. Es el último tramo del día: no lo perdáis. Confirmad precio en taquilla.","tm":"","g":""},{"k":"T","id":"d3x65","n":"Como","q":"Como città","a":"Ciudad de la seda a orillas del lago, con catedral de mármol blanco","b":"Casco antiguo peatonal y paseo lacustre. Desde aquí salen los barcos a las villas.","x":"Como fue romana (Novum Comum, fundada por Julio César) y capital de la seda durante siglos. Su centro medieval se recorre en poco tiempo y su lago es el eje de la vida local."},{"k":"M","id":"d3x66","n":"Aperitivo","e":"🍹","d":40,"at":0,"a":"terrazza 241 hilton para aperitivo"},{"k":"S","id":"d3x67","n":"Piazza del Duomo y Duomo di Como","z":"Como","p":[45.8104,9.0848],"d":30,"q":"Piazza del Duomo Duomo di Como Como","a":"Plaza histórica y catedral gótico-renacentista de mármol blanco en el centro de Como.","b":"Templo gótico-renacentista de mármol blanco (exterior).","x":"Su construcción duró casi cuatro siglos (1396–1770), por eso mezcla gótico, Renacimiento y barroco. Es de mármol blanco y en la fachada destacan las estatuas de Plinio el Viejo y Plinio el Joven, ambos nacidos en Como.","g":"","s0":0,"o":0},{"k":"M","id":"d3x68","n":"Cena: Risotto con filetto di pesce persico* o *polenta concia*.","e":"🍽️","d":90,"at":1200,"a":"sugerencia_"}]},{"n":4,"t":"Sirmione y Verona","e":"💘","q":"Verona Arena","s":600,"h":{"Verona":[45.4452,10.9985]},"items":[{"k":"D","n":"De Lombardia A Véneto"},{"k":"R","id":"d4r71","e":"🚗","n":"Como → Sirmione (A4)","d":105,"km":150,"at":0,"x":"Conducción directa desde Como por la autopista A4 hacia la península de Sirmione (~150 km, ~1 h 40 min). Salida a las 10:00.","tm":"","g":""},{"k":"T","id":"d4x72","n":"Sirmione","q":"Sirmione città","a":"Península estrecha sobre el lago de Garda, con castillo y villa romana","b":"Pueblo peatonal medieval dentro de un foso. El coche se deja fuera, en parking.","x":"Sirmione ocupa una lengua de tierra de unos 4 km que se adentra en el Garda, el mayor lago de Italia. Catulo, poeta romano, tuvo aquí una casa. Sus termas son conocidas desde hace siglos."},{"k":"S","id":"d4x73","n":"Istmo de Sirmione","z":"Sirmione","p":[45.4905,10.6075],"d":10,"q":"Istmo de Sirmione Sirmione","a":"Estrecho acceso fortificado a la península de Sirmione, sobre el Garda","b":"Entrada a pie a la península; casco histórico peatonal.","x":"El casco antiguo de Sirmione ocupa una estrecha lengua de tierra de unos 4 km que se adentra en el lago de Garda. El único acceso al pueblo es un puente sobre un foso, junto a la fortaleza.","g":"","s0":0,"o":0},{"k":"S","i cto. La leyenda de Shakespeare la hizo mundialmente famosa."},{"k":"S","id":"d4x81","n":"Piazza e Iglesia de Santa Anastasia","z":"Verona","p":[45.4448,10.9979],"d":25,"q":"Piazza e Iglesia de Santa Anastasia Verona","a":"Templo mayor de los dominicos y principal monumento gótico de Verona con frescos de Pisanello.","b":"Gótico dominico con el San Jorge de Pisanello. ~4 €.","x":"Iglesia de los dominicos con la mayor bóveda gótica de Verona, empezada en 1290. Alberga el fresco de San Jorge y la princesa de Pisanello y los «gobbi», figuras agachadas que sostienen las pilas de agua bendita.","g":"","s0":0,"o":0},{"k":"S","id":"d4x82","n":"Arche Scaligere","z":"Verona","p":[45.4437,10.9979],"d":10,"q":"Arche Scaligere Verona","a":"Complejo funerario gótico al aire libre con elaborados sarcófagos de la dinastía Scaligera.","b":"Tumbas góticas de los señores de Verona (Cangrande I) con rejas de escaleras.","x":"Sepulcros góticos de la familia Scaligera, señores de Verona en los siglos XIII y XIV. Destaca la tumba de Cangrande I, y las rejas de hierro llevan el símbolo de la dinastía: la escalera (della Scala).","g":"","s0":0,"o":0},{"k":"S","id":"d4x83","n":"Piazza dei Signori (Piazza Dante)","z":"Verona","p":[45.4433,10.9976],"d":10,"q":"Piazza dei Signori Verona","a":"Plaza señorial flanqueada por el Palazzo del Podestà y presidida por la estatua de Dante.","b":"Rodeada del Palazzo della Ragione, la Loggia del Consiglio y el Palazzo del Capitano. La estatua de Dante recuerda su exilio en Verona.","x":"Es el salón político de la Verona medieval. Dante fue acogido en la ciudad durante su exilio y hoy su estatua preside una plaza rodeada de palacios de los siglos XIII–XV.","g":"","s0":0,"o":0},{"k":"S","id":"d4x84","n":"Piazza delle Erbe","z":"Verona","p":[45.4435,10.9969],"d":10,"q":"Piazza delle Erbe Verona","a":"Antiguo foro romano con la Torre dei Lamberti y la fuente barroca de Madonna Verona.","b":"Mercadillo diario. Entrada a la Torre dei Lamberti ~8 € (con ascensor o y Petrarca. Antes de ser plaza fue teatro romano y feria.","g":"","s0":0,"o":0},{"k":"S","id":"d5x96","n":"Basílica de San Antonio de Padua (Il Santo)","z":"Padova","p":[45.4017,11.8808],"d":40,"q":"Basílica de San Antonio de Padua Padova","a":"Templo románico-gótico bizantino con 8 cúpulas que alberga la tumba del santo y relieves de Donatello.","b":"Plaza elíptica con 78 estatuas y el Santo con relieves de Donatello. Gratis.","x":"Construida desde 1232, un año después de la muerte de San Antonio, combina elementos románicos, góticos y bizantinos en sus ocho cúpulas. Guarda la tumba del santo y relieves de bronce de Donatello en el altar mayor.","g":"","s0":0,"o":0},{"k":"S","id":"d5x97","n":"Capilla de los Scrovegni","z":"Padova","p":[45.4118,11.8789],"d":60,"q":"Capilla de los Scrovegni Padova","a":"Los frescos de Giotto (1303–05)","b":"Los frescos de Giotto (1303–05). Entrada ~15 € con reserva estricta online.","x":"Giotto pintó entre 1303 y 1305 el ciclo de la vida de la Virgen y de Cristo, considerado el inicio de la pintura moderna. La capilla se visita en turnos cortos con control de humedad.","g":"","s0":0,"o":1},{"k":"S","id":"d5x98","n":"Piazza delle Erbe y Palazzo della Ragione (Padua)","z":"Padova","p":[45.4069,11.8774],"d":30,"q":"Piazza delle Erbe Palazzo della Ragione Padova","a":"Mercado medieval bajo las arcadas de un majestuoso palacio Comunal del siglo XIII.","b":"Mercado al aire libre bajo las arcadas del Palazzo della Ragione. El gran salón con frescos se visita (entrada de pago, consultad horario).","x":"El Palazzo della Ragione, del siglo XIII, tiene una de las grandes salas medievales de Europa, con techo de madera en forma de quilla de barco. Alrededor, la Piazza delle Erbe y la de la Frutta son mercado desde la Edad Media.","g":"","s0":0,"o":0},{"k":"M","id":"d5x99","n":"Almuerzo","e":"🍽️","d":40,"at":0,"a":""},{"k":"R","id":"d5r101","e":"🚗","n":"Padua → Venezia Mestre (entrega del coche)","d":30,"km":38,"at":0,"x":"Última conducción por
