.act{display:flex;gap:8px}.act button{flex:1;border:0;border-radius:14px;padding:10px 6px;font:800 13px inherit;background:#f3f3f6;color:var(--t)}

textarea.show{display:block}textarea:focus{outline:0;border-color:var(--a)}

.rc .act button{padding:7px 4px;font-size:12.5px;background:#fff}.rc .act .v{background:#6b6b73}.rc.done .act .v{background:var(--g)}
.ml{margin:0 14px 14px;padding:10px 12px;border-radius:18px;background:var(--gl);border-left:6px solid var(--g)}.ml.done{background:#d3f0df}

.mi{white-space:pre-line}.web{display:block;margin-top:8px;text-align:center;text-decoration:none;font-weight:800;font-size:13.5px;padding:9px;border-radius:12px;background:var(--gl);color:#13693a}
.act button{padding:10px 4px!important;font-size:12.5px!important}
.kmb{position:absolute!important;top:14px;right:14px;background:#fff;color:var(--rd);border-radius:18px;padding:6px 12px;text-align:center;line-height:1.05;box-shadow:0 3px 10px #0004}.kmb b{display:block;font-size:26px;font-weight:900}.kmb small{font-size:11px;font-weight:800}.kmb span{font-size:16px}
.tg{font-style:italic;color:var(--rd);font-weight:700;margin:2px 0 6px}
.gal{display:flex;gap:8px;overflow-x:auto;margin-top:10px}.gal img{height:130px;border-radius:12px;flex:none}
.dv{text-align:center;font-weight:900;color:var(--m);margin:6px 0 14px;font-size:13px;letter-spacing:.6px;text-transform:uppercase}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20}#ov.on{display:block}
#sh{position:fixed;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;z-index:21;transform:translateY(105%);transition:.35s;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
#sh.on{transform:none}#sh .ph{height:210px;border-radius:26px 26px 0 0}#sh .bd{padding:16px 18px}#sh h3{font-size:22px}
.x{position:absolute;right:12px;top:12px;width:38px;height:38px;border:0;border-radius:50%;background:#fff;font-size:18px;font-weight:900;box-shadow:0 2px 8px #0003}
.wk{white-space:pre-line;font-size:15.5px;line-height:1.6;color:#2a2a30}.hd{font-weight:900;color:var(--r);margin:16px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.w4{width:100%;border:0;border-radius:14px;padding:12px;font:800 14px inherit;background:var(--gl);color:#13693a;margin-top:6px}
.lk{display:flex;gap:8px;margin-top:14px}.lk a{flex:1;text-align:center;text-decoration:none;font-weight:800;font-size:14px;padding:11px;border-radius:14px;background:var(--gl);color:#13693a}.lk a:first-child{background:var(--rl);color:var(--rd)}
.cr{font-size:11px;color:var(--m);margin-top:8px}.cf{position:fixed;z-index:30;pointer-events:none;font-size:24px}
footer{text-align:center;font-size:12px;color:var(--m);padding:6px 14px 24px}
</style></head><body>

<script>
const D=[{"tl":"Bérgamo","n":1,"t":"Bérgamo Alta","e":"🏰","q":"Bergamo Città Alta","s":720,"h":{"Bergamo":[45.7036,9.66]},"items":[{"k":"T","id":"d1x1","n":"Bergamo","q":"Bergamo città","a":"Dos ciudades en una: la Città Alta medieval amurallada y la Città Bassa moderna. Unos 120.000 habitantes. La Città Alta, sobre una colina rodeada de murallas venecianas (UNESCO), se recorre a pie en una tarde. Se sube en funicular desde la Città Bassa. Fundada por los celtas y romanizada con el nombre de Bergomum, Bérgamo vivió siglos bajo la República de Venecia (1428–1797), que levantó sus murallas. Es tierra de Donizetti y de buena cocina: polenta, casoncelli y stracciatella.","pn":"Bérgamo es una joya articulada en dos niveles bien diferenciados: la Città Alta (ciudad alta), encaramada en las colinas y rodeada por poderosas murallas, y la Città Bassa (ciudad baja), moderna y bulliciosa. Su origen se remonta a los celtas y romanos (Bergomum), pero su fisonomía dorada quedó inmortalizada bajo el largo dominio de la República de Venecia (siglos XV al XVIII). Hoy en día es un próspero centro cultural y universitario que conserva intacta su atmósfera medieval y renacentista, ofreciendo una de las panorámicas más elegantes del norte de Italia."},{"k":"R","id":"d1r3","e":"✈️","n":"Sevilla → Aeropuerto de Milán-Bérgamo (BGY)","d":0,"km":0,"at":0,"x":"Vuelo de Sevilla (SVQ) a Milán-Bérgamo, en Orio al Serio, a unos 5 km del centro histórico de Bérgamo. Aterrizaje previsto hacia las 12:00. Llevad documentación a mano y revisad la terminal en la tarjeta de embarque.","tm":"Mañana","g":""},{"k":"R","id":"d1r4","e":"🚕","n":"Taxi BGY → Via Mario Lupo 6 (Bérgamo Alta)","d":30,"km":6,"at":0,"x":"Taxi desde el aeropuerto hasta el alojamiento en Via Mario Lupo 6, en la Città Alta (~25–35 € en total, ~20–30 min). Después, check-in y dejar maletas.","tm":"","g":""},{"k":"S","id":"d1x5","n":"Via Mario Lupo","z":"Bergamo","p":[45.7036,9.66],"d":30,"q":"Via Mario Lupo Bergamo","a":"Calle residencial histórica patricia con fachadas sobrias de piedra y arcadas barrocas. Calle de la Città Alta donde está vuestro alojamiento (nº 6), a un paso de Via Gombito y de la torre. Una de las calles del eje histórico de la Città Alta, entre casas señoriales de piedra. Su posición central permite hacer casi todo a pie desde el alojamiento.","g":"","s0":0,"o":0,"i":["El trazado medieval entre sombras de piedra y memoria de sabios.","Esta arteria empedrada recorre el núcleo histórico de la Città Alta. Lleva el nombre de Mario Lupo, un destacado historiador y canónigo del siglo XVIII que documentó los orígenes de la ciudad. La calle serpentea siguiendo el antiguo trazado romano y medieval, conectando la zona del trazado señorial con los accesos orientales de la fortaleza.","Destaca por sus palacetes de fachada sobria, arcos de piedra de cantería y patios interiores con soportales góticos y renacentistas. La iluminación tenue de sus farolas resalta el contraste entre el yeso envejecido y los sillares de piedra.","Bajo sus adoquines discurren pasadizos y restos de conducciones romanas que abastecían a la antigua Bergomum.","Busca a mitad de calle las pequeñas molduras de piedra en los marcos de las ventanas de los pisos superiores: algunas conservan grabados medievales y monogramas religiosos."],"v":"Espacio público: acceso libre."},{"k":"S","id":"d1x6","n":"Via Gombito","z":"Bergamo","p":[45.7041,9.6604],"d":5,"q":"Via Gombito Bergamo","a":"Antiguo Decumanus Maximus romano que conserva el trazado medieval con comercios tradicionales. Heredera del cardo romano, esta calle une la Città Alta con la Piazza Vecchia. Conserva soportales y tiendas de siempre, y en ella se prueban los dulces típicos de Bérgamo.","g":"","s0":0,"o":0,"i":["La espina dorsal del comercio medieval bergamasco.","Desde la época romana, cuando coincidía con parte del Decumanus Maximus, Via Gombito ha sido el eje comercial y social más transitado de la Ciudad Alta. Une la Piazza Mercato delle Scarpe con la Piazza Vecchia, albergando históricamente los talleres y comercios más relevantes de la villa.","Flanqueada por edificios medievales de varias alturas con bajos comerciales abovedados. En ella sobresale la imponente Torre del Gombito, construida en piedra caliza clara de factura maciza.","Su nombre deriva del término compitum, que en latín hace referencia al cruce de caminos principales.","Levanta la vista al caminar para contemplar los balcones de hierro forjado y los antiguos voladizos de madera que sobresalen de las fachadas superiores."],"v":"Pizza al taglio ~10 €/p."},{"k":"M","id":"d1x7","e":"🍽️","d":40,"at":0,"n":"Almuerzo: Pizza al taglio","a":"Aunque originaria de Roma, la pizza al taglio (en porciones rectangulares vendidas al peso) es la reina del tentempié rápido en los paseos por la Ciudad Alta. Masa crujiente por fuera y aireada por dentro, cubierta con quesos locales como el Taleggio o embutidos lombardos.","q":"Pizza al taglio"},{"k":"S","id":"d1x8","n":"Torre del Gombito","z":"Bergamo","p":[45.7037,9.6598],"d":10,"q":"Torre del Gombito Bergamo","a":"Torre defensiva de piedra de 52 metros del siglo XI, símbolo del poder nobiliario. Construida en el siglo XI como torre de vigilancia de una familia noble, mide 52 m y es una de las torres medievales mejor conservadas de la Città Alta. Su silueta marca el eje de Via Gombito, la antigua calle mayor romana.","g":"","s0":0,"o":0,"i":["El guardián de piedra que desafía al cielo de Bérgamo.","Construida en el siglo XII durante las pugnas entre familias nobles rivales (güelfos y ghibelinos), esta torre privada funcionaba como símbolo de poder y elemento defensivo. En el siglo XVI pasó a manos del municipio.","Ejemplo impecable de arquitectura militar románica. Con sus 52 metros de altura, su estructura rectilínea muestra sillares de piedra perfectamente tallados con aberturas defensivas reducidas (saeteras) en los niveles inferiores.","A pesar de las leyes medievales que ordenaron desmochar o reducir la altura de la mayoría de torres nobiliarias para limitar el poder de las familias, esta torre logró salvarse casi intacta.","Observa la ausencia casi total de ventanas en la mitad inferior de la torre, diseñada intencionadamente para resistir asedios prolongados."],"v":"Fachada gratis; terraza con reserva en la oficina de turismo."},{"k":"S","id":"d1x9","n":"Piazza Vecchia","z":"Bergamo","p":[45.7042,9.6612],"d":15,"q":"Piazza Vecchia Bergamo","a":"Salón urbano monumental renacentista valorado por Le Corbusier. Plaza porticada y peatonal del casco antiguo. Mejor a primera hora o con la luz de la tarde. Rodeada por el Palazzo della Ragione, la Torre Civica, el Palazzo Nuovo (hoy biblioteca) y la fuente Contarini, es el salón de la ciudad. Le Corbusier la elogió como una de las plazas más bellas de Europa.","g":"","s0":0,"o":0,"i":["El salón renacentista al aire libre de Bérgamo.","Proyectada en el siglo XV bajo el dominio veneciano como el verdadero corazón político y social de la Città Alta. Le Corbusier la definió como una de las plazas más perfectas del mundo, donde cada proporción arquitectónica guarda una armonía absoluta.","Rodeada por el Palazzo della Ragione, el Palazzo Nuovo y la Torre Cívica. Combina la sobriedad gótica con la elegancia del renacimiento y el neoclasicismo.","La disposición geométrica de la plaza crea una ilusión óptica donde los edificios parecen cerrar herméticamente el espacio, aunque cuenta con múltiples accesos laterales.","Sitúate en el centro de la plaza y observa cómo la fachada de mármol blanco del Palazzo Nuovo refleja la luz del atardecer contrastando con la piedra oscura de la acera opuesta."],"v":"Espacio público: acceso libre."},{"k":"S","id":"d1x10","n":"Palazzo della Ragione","z":"Bergamo","p":[45.7041,9.661],"d":20,"q":"Palazzo della Ragione Bergamo","a":"Ayuntamiento comunal del siglo XII con arcos ojivales, León de San Marcos y meridiano solar. Ayuntamiento más antiguo de Lombardía (s. En el suelo del pórtico está el meridiano solar de 1798 y en la fachada el león alado de San Marcos recuerda el dominio veneciano.","g":"","s0":0,"o":0,"i":["El pórtico de la justicia medieval.","Erigido a finales del siglo XII, es el palacio comunal más antiguo de Lombardía. Servía como tribunal de justicia e intermediario entre el poder civil y el religioso.","Destaca su pórtico abierto en la planta baja con arcos apuntados de piedra. En el piso superior resalta una gran sala con ventanas ajimezadas y el relieve del León de San Marcos en la fachada principal.","En el suelo bajo su pórtico se conserva un reloj solar (meridiana) trazado en el siglo XVIII que sigue marcando con precisión el mediodía solar.","Busca en el pavimento porticado la línea de latón e incrustaciones de mármol del reloj solar y los signos del zodiaco grabados."],"v":"Pórtico libre; sala ~5 €."},{"k":"S","id":"d1x11","n":"Il Campanone (Torre Cívica)","z":"Bergamo","p":[45.7043,9.6613],"d":25,"q":"Torre Civica Bergamo","a":"Torre de 52 metros con la campana más grande de Lombardía que repica 100 veces a las 22:00h. Torre de 52 m con la campana mayor de Lombardía: suena 100 veces cada noche a las 22:00. Junto a la Fontana Contarini (1780). Torre del siglo XII que sigue haciendo sonar cada noche a las 22:00 un toque heredado del antiguo toque de queda.","g":"","s0":0,"o":0,"i":["El latido de bronce de la Ciudad Alta.","Levantada entre los siglos XI y XII por la familia Suardi, pasó posteriormente a control municipal. Con 52 metros de altura, su gran campana llamaba a la población a concejo o advertía de peligros.","Estructura románica de piedra con un cuerpo superior rematado por un campanario almenado fruto de intervenciones posteriores.","Todos los días a las 22:00 horas, la campana suena 100 veces consecutivas, un ritual histórico que avisaba del cierre nocturno de las puertas de las murallas venecianas.","Al subir a la cima, fíjate en el enorme mecanismo del campanario e intenta coincidir con las vistas panorámicas sobre los tejados rojos de la ciudad."],"v":"~5 € con museo. Se sube en ascensor y desde arriba se ve toda la Città Alta, la llanura del Po y, en días claros, los Alpes."},{"k":"S","id":"d1x12","n":"Fontana Contarini","z":"Bergamo","p":[45.7042,9.6611],"d":5,"q":"Fontana Contarini Bergamo","a":"Fuente ornamental de 1780 ubicada en el centro de la plaza, decorada con esfinges y leones. En el centro de la Piazza Vecchia, regalada a la ciudad en 1780. Fuente de mármol blanco donada por Alvise Contarini, podestà veneciano, en 1780. Los leones y esfinges que la decoran son muy fotografiados.","g":"","s0":0,"o":0,"i":["El regalo veneciano de esfinges y mármol.","Donada a la ciudad en 1780 por el podestà veneciano Alvise Contarini para adornar la Piazza Vecchia y proveer de agua potable a los vecinos en épocas de sequía.","Obra de estilo barroco/neoclásico tallada en mármol blanco de Zandobbio. Presenta un estanque central rodeado por estatuas alegóricas, leones y esfinges.","Durante mediados del siglo XIX la fuente fue desmontada para colocar en su lugar un monumento a Garibaldi, pero décadas después volvió a su emplazamiento original.","Fíjate en el tallado de las esfinges encadenadas que flanquean el pilón central; sus ropajes decorativos conservan finos detalles escultóricos."],"v":"Espacio público: acceso libre."},{"k":"S","id":"d1x13","n":"La Rocca di Bergamo","z":"Bergamo","p":[45.705,9.6683],"d":25,"q":"La Rocca di Bergamo Bergamo","a":"Fortaleza viscontea del siglo XIV hoy convertida en parque y museo. Parque de la Rocca con miradores sobre la llanura. Paseo tranquilo con mucha sombra. Levantada en 1331 por los Visconti de Milán sobre la colina de Sant'Eufemia, pasó después a manos venecianas y fue cuartel. Hoy es un parque con museo histórico y uno de los mejores miradores de la ciudad.","g":"","s0":0,"o":0,"i":["La fortaleza atalaya sobre las colinas.","Iniciada en 1331 por Juan de Luxemburgo, rey de Bohemia, y ampliada por los Visconti de Milán y los venecianos. Servía tanto para defender la ciudad de ataques exteriores como para controlar las revueltas internas.","Fortaleza de planta cuadrangular rodeada por torreones cilíndricos en sus esquinas y murallas almenadas con aspilleras.","En su interior albergaba polvorines y alojamientos para tropas mercenarias. Hoy alberga el Museo del Risorgimento.","Pasea por la explanada del parque defensivo para descubrir cañones históricos orientados hacia los valles circundantes."],"v":"Contiene el museo de la historia de Bérgamo (consultad horario en el momento)."},{"k":"S","id":"d1x14","n":"Piazza del Duomo","z":"Bergamo","p":[45.7035,9.6619],"d":5,"q":"Piazza del Duomo Bergamo","a":"Plaza monumental que concentra un deslumbrante patrimonio artístico. Plaza monumental pegada a la Piazza Vecchia: aquí se concentran el Duomo, Santa Maria Maggiore y la Capilla Colleoni. Reúne en pocos metros la catedral, la basílica y el mausoleo Colleoni: siglos de arte, del románico al Renacimiento.","g":"","s0":0,"o":0,"i":["El íntimo escenario del arte sacro bergamasco.","Angosta y monumental, esta plaza se constituyó como el epicentro religioso de Bérgamo, agrupando en un espacio reducido la Catedral, la Basílica y la Capilla Colleoni.","Espacio rodeado por distintas etapas artísticas: desde el románico lombardo hasta el renacimiento exuberante y el neoclasicismo.","Su reducido tamaño se debe a la superposición de edificios a lo largo de los siglos sobre el antiguo foro romano.","Ponte en la entrada del baptisterio adyacente para captar en una sola mirada las tres fachadas monumentales que la componen."],"v":"Espacio público: acceso libre."},{"k":"S","id":"d1x15","n":"Duomo di Bergamo","z":"Bergamo","p":[45.7034,9.662],"d":15,"q":"Duomo di Bergamo Bergamo","a":"Catedral dedicada a San Alejandro, con fachada neoclásica y gran cúpula. Su fachada actual es del siglo XIX y su cúpula domina el perfil de la Città Alta. Dedicada a San Alejandro, patrón de Bérgamo, se levantó sobre templos anteriores. Está pegada a la Basílica de Santa Maria Maggiore y la Capilla Colleoni, formando el conjunto monumental de la plaza.","g":"","s0":0,"o":0,"i":["El templo blanco dedicado al patrón milenario.","Dedicada a San Alejandro de Bérgamo, patrón de la ciudad, sus cimientos se asientan sobre antiguas iglesias del siglo V. La construcción del templo actual abarcó desde el siglo XV hasta el XIX.","Fachada neoclásica de mármol blanco. Su interior, de una sola nave con cruz latina, destaca por la profusión de estucos barrocos, frescos y lienzos de maestros como Tiepolo.","Bajo el altar mayor reposan las reliquias de San Alejandro y una importante colección de orfebrería sacra histórica.","Admira la tiara papal expuesta en su interior que perteneció al Papa Juan XXIII, originario de la provincia de Bérgamo."],"v":"Entrada libre (respetad los horarios de misa)."},{"k":"S","id":"d1x16","n":"Basílica de Santa Maria Maggiore","z":"Bergamo","p":[45.7038,9.6622],"d":20,"q":"Basílica de Santa Maria Maggiore Bergamo","a":"Templo románico lombardo de 1137 con deslumbrante interior barroco y tumba de Donizetti. Románico lombardo por fuera, estuco y oro por dentro. Iniciada en 1137, sorprende por su interior barroco cubierto de tapices, estucos y frescos que contrasta con la sobriedad románica del exterior. Aquí está la tumba del compositor Gaetano Donizetti, nacido en Bérgamo.","g":"","s0":0,"o":0,"i":["El tapiz románico de estucos y devoción popular.","Fundada en 1137 como voto a la Virgen para proteger a la ciudad de una epidemia de peste. Al no depender directamente del obispado, fue la iglesia del pueblo y del municipio.","Exterior románico lombardo con porches soportados por leones de mármol rojo y blanco. El interior es un deslumbrante estallido barroco con tapices florentinos y taraceas de madera diseñadas por Lorenzo Lotto.","La basílica carece de una gran portada principal central; se accede exclusivamente por sus entradas porticadas laterales.","Dirígete a la sillería del coro para examinar los Paneles de Taracea con escenas bíblicas concebidas por Lorenzo Lotto."],"v":""},{"k":"S","id":"d1x17","n":"Capilla Colleoni","z":"Bergamo","p":[45.7036,9.662],"d":15,"q":"Capilla Colleoni Bergamo","a":"Mausoleo renacentista de Bartolomeo Colleoni con fachada geométrica en mármoles policromados. Mausoleo renacentista (1472–76) de mármol blanco, rojo y negro. Construida entre 1472 y 1476 para el condotiero Bartolomeo Colleoni, que había servido a Venecia. Obra maestra del Renacimiento lombardo, con fachada de mármol polícromo y frescos de Tiepolo en el interior.","g":"","s0":0,"o":0,"i":["La joya renacentista del condotiero deslumbrante.","Erigida entre 1472 y 1476 por el arquitecto Giovanni Antonio Amadeo como mausoleo privado para el famoso capitán de fortuna Bartolomeo Colleoni.","Obra cumbre del Renacimiento lombardo. Fachada polícroma con mármoles blancos, rojos y negros, rosetones policromados, pilastras y relieves mitológicos e históricos.","Colleoni ordenó derribar la sacristía de la vecina Santa Maria Maggiore para construir su propio mausoleo a pesar de las protestas de los canónigos.","En la verja de hierro exterior, busca el escudo de armas de Colleoni con tres pares de testículos; la tradición dice que tocarlo trae buena suerte."],"v":"Entrada gratis; cierra lunes."},{"k":"S","id":"d1x18","n":"Palazzo Moroni","z":"Bergamo","p":[45.7055,9.6643],"d":35,"q":"Palazzo Moroni Bergamo","a":"Palacio barroco del siglo XVII con frescos, colección de arte y jardín en terrazas.","g":"","s0":0,"o":1,"i":["El esplendor aristocrático del Barroco bergamasco.","Construido a mediados del siglo XVII por la noble familia Moroni, este palacio conserva intacta su colección de arte y sus interiores originales tras siglos de uso residencial.","Destaca por sus salones deslumbrantes con frescos mitológicos de Gian Giacomo Barbelli y sus jardines escalonados en terrazas.","Cuenta con un huerto y viñedo interior (Ortaglia) que se extiende a los pies de la muralla, un oasis verde en pleno casco histórico.","Observa la escalera de honor de piedra con estucos que da acceso al piso noble, un alarde de perspectiva barroca."],"v":"Vie–dom 10–18 h, ~10–12 €, reserva online.","u":"https://www.palazzomoroni.it"},{"k":"S","id":"d1x19","n":"Colle Aperto y Porta San Alessandro","z":"Bergamo","p":[45.7053,9.654],"d":15,"q":"Porta Sant'Alessandro Bergamo||Colle Aperto Bergamo||Bergamo Città Alta porta","a":"Punto defensivo histórico que conectaba la muralla con el ascenso a la colina. Punto débil de la ciudad, blindado por Venecia. Colle Aperto es la «colina abierta»: el único punto por el que la Città Alta era fácil de atacar. Los venecianos lo resolvieron en el siglo XVI con fosos, baluartes y la imponente Porta San Alessandro.","g":"","s0":0,"o":0,"i":["El paso estratégico hacia los valles y colinas.","Colle Aperto es un punto nodal en el extremo oeste de la Ciudad Alta, flanqueado por la Puerta de San Alessandro, construida en el siglo XVI sobre estructuras medievales defensivas.","La puerta presenta un revestimiento monumental de piedra con almohadillado defensivo y el espacio para el puente levadizo.","Era la puerta de acceso para los viajeros que venían desde Lecco y Como, fuertemente custodiada por las rondas venecianas.","Fíjate en las ranuras verticales sobre el arco superior de la puerta por donde descendían las cadenas del puente levadizo original."],"v":"Subid andando 20 min o funicular (~1,70 €). Desde aquí sale el funicular a San Vigilio (~1,70 €) o un sendero de unos 20 minutos a pie."},{"k":"S","id":"d1x20","n":"Castello di San Vigilio","z":"Bergamo","p":[45.7091,9.6527],"d":40,"q":"Castello di San Vigilio Bergamo","a":"Fortaleza medieval y veneciana situada a 496m de altitud con panorámicas del horizonte alpino. A 496 m, el punto más alto de Bérgamo. Vistas a los Alpes y la llanura del Po: ¡el sitio del atardecer! Se llega a pie o en funicular desde Colle Aperto.","g":"","s0":0,"o":0,"i":["La atalaya inexpugnable en la cima del mundo bergamasco.","Asentado en el punto más alto del cerro (496 metros), ha sido una posición militar clave desde época romana. El castillo actual se desarrolló entre los siglos XIV y XVI.","Fortaleza con baluartes semicirculares, troneras para artillería y fosos defensivos diseñados para la guerra con pólvora.","Un túnel subterráneo secreto conectaba el castillo con la Fortaleza (Rocca) para permitir la huida o el envío de refuerzos.","Sube a la torre principal para divisar una vista panorámica de 360 grados que abarca los Alpes Lombardos y toda la llanura padana."],"v":"Gratis, 08–20 h."},{"k":"S","id":"d1x21","n":"Le Mura Veneziane","z":"Bergamo","p":[45.7003,9.6582],"d":15,"q":"Mura venete Bergamo||Venetian Walls of Bergamo||Mura di Bergamo Città Alta","a":"Murallas del siglo XVI declaradas Patrimonio de la Humanidad por la UNESCO con 14 baluartes. Levantadas entre 1561 y 1588 para proteger Bérgamo, la ciudad más occidental de la República de Venecia, rodean la Città Alta a lo largo de más de 5 km con 14 baluartes y cuatro puertas. Desde 2017 son Patrimonio de la Humanidad (UNESCO).","g":"","s0":0,"o":0,"i":["El cinturón de piedra abaluartado Patrimonio de la Humanidad.","Construidas por la República de Venecia entre 1561 y 1588 para proteger la frontera oeste de sus dominios continentales. Cuentan con más de 6 kilómetros de perímetro y son Patrimonio Mundial de la UNESCO.","Sistema defensivo de bastiones, puertas monumentales y murallas de piedra caliza con inclinación en talud.","Su construcción requirió la demolición de más de 250 edificios medievales, incluidas dos catedrales históricas.","Durante el paseo por el perímetro, busca los grandes leones de San Marcos esculpidos sobre las puertas principales."],"v":"Paseo libre 24 h."},{"k":"S","id":"d1x22","n":"Porta San Giacomo","z":"Bergamo","p":[45.7,9.665],"d":5,"q":"Porta San Giacomo Bergamo","a":"La más monumental de las cuatro puertas de la muralla veneziana, con mármol claro y el león de San Marcos. Terminada a finales del siglo XVI, presume de mármol blanco y de los emblemas de la República de Venecia. Marca la entrada sur de la Città Alta y el final natural del paseo por las murallas.","g":"","s0":0,"o":0,"i":["La puerta de mármol blanco que saluda a la llanura.","Diseñada en 1586 como la entrada de gala a la ciudad para quienes llegaban desde Milán.","Construida íntegramente en mármol blanco de Zandobbio, destaca por su diseño neoclásico/renacentista con un gran relieve del León de Venecia en el ático.","Es la única puerta de la muralla pensada con una función eminentemente estética y de representación, más que puramente militar.","Admira la perspectiva desde el viaducto de acceso con arcos de piedra que se eleva sobre el foso ajardinado."],"v":"Paseo libre 24 h."},{"k":"M","id":"d1x23","e":"🍽️","d":90,"at":1200,"n":"Cena: Casoncelli","a":"La pasta rellena por excelencia de Bérgamo (Casoncelli alla bergamasca). Media luna de pasta fresca rellena de carne, galleta amaretti, pasas y pera, servida con abundante mantequilla derretida, panceta crujiente y hojas de salvia fresca.","q":"Casoncelli alla bergamasca"}]},{"tl":"Milán","n":2,"t":"Milán","e":"🏙️","q":"Milano Duomo","s":660,"h":{"Milano":[45.4651,9.1943]},"items":[{"k":"T","id":"d2x24","n":"Milán","q":"Milano città","a":"Capital moral y económica de Italia, donde la vanguardia dialoga con dos milenios de historia. Segunda ciudad del país, con el Duomo como símbolo y barrios muy distintos entre sí. Para ir de uno a otro se usa metro o se camina. Fundada por las tribus galas hacia el año 600 a.C. (*Mediolanum*, la \"ciudad en medio de la tierra\"), se convirtió en una de las capitales más prósperas del tardío **Imperio Romano**, lugar desde el cual el emperador Constantino promulgó el famoso Edicto de Milán en el año 313 d.C. legalizando el cristianismo. Durante la Edad Media y el Renacimiento, Milán estuvo dominada por dos grandes familias rivales que modelaron su fisonomía: los **Visconti** (quienes iniciaron la construcción del Duomo y proyectaron el poder militar de la serpiente *biscione*) y los **Sforza**, señores de la guerra que convirtieron la corte milanesa en un imán para los mayores genios de Europa, entre ellos **Leonardo da Vinci**. Tras siglos de dominio español y austriaco que aportaron sobriedad y elegancia neoclásica, Milán resurgió en el siglo XX como el epicentro de la moda, el diseño industrial y el dinamismo italiano.","pn":"Fundada por los galos e incorporada a Roma con el nombre de Mediolanum, Milán ha sido el motor económico y político del norte de Italia. Gobernada en el Renacimiento por las dinastías Visconti y Sforza, se convirtió en mecenas del arte vanguardista. Hoy en día es la capital financiera, de la moda y del diseño de Italia, donde los rascacielos contemporáneos conviven armónicamente con catedrales góticas y palacios históricos."},{"k":"R","id":"d2r26","e":"🚆","n":"Tren Bérgamo → Milano Centrale","d":0,"km":55,"at":0,"x":"Bajada desde la Città Alta a la estación (funicular + paseo), con margen. El tren regional tarda ~1 h y llega a Milano Centrale hacia las 11:00. Billete en máquina o app; validad el billete si es de papel.","tm":"10:00 → 11:00","g":"","u":"https://www.trenord.it"},{"k":"R","id":"d2r27","e":"🚕","n":"Taxi Milano Centrale → Via San Paolo 13","d":30,"km":4,"at":0,"x":"Taxi desde la estación hasta el alojamiento (~12–18 € en total). Instalación y salida a pie.","tm":"","g":""},{"k":"S","id":"d2x28","n":"Via San Paolo","z":"Milano","p":[45.4651,9.1943],"d":20,"q":"Via San Paolo Milano","a":"Vía aristocrática neoclásica cercana al antiguo centro religioso de la ciudad. Calle neoclásica a pocos minutos del Duomo; aquí está vuestro alojamiento (nº 13). Calle tranquila del centro histórico de Milán, cerca de Corso Vittorio Emanuele II y de la plaza del Duomo, con palacios neoclásicos.","g":"","s0":0,"o":0,"i":["El tranquilo callejón del neoclasicismo lombardo.","Una calle histórica cercana al centro neurálgico que albergó monasterios e instituciones civiles desde el periodo barroco y neoclásico.","Fachadas de líneas sobrias con portadas de piedra, patios interiores porticados y balconadas de forja fina.","Esta zona sirvió de refugio a intelectuales durante las agitaciones del Risorgimento italiano.","Observa los faroles de hierro de las fachadas que conservan el diseño tradicional del alumbrado milanés del siglo XIX."],"v":"Espacio público: acceso libre."},{"k":"S","id":"d2x29","n":"Corso Vittorio Emanuele II","z":"Milano","p":[45.4656,9.1935],"d":5,"q":"Corso Vittorio Emanuele II Milano","a":"Avenida peatonal vibrante comercial que conduce directamente hacia la catedral. Calle peatonal comercial entre San Babila y la plaza del Duomo, con grandes tiendas y cines. Es el eje comercial de Milán: una avenida peatonal que une San Babila con el Duomo, bordeada de tiendas, cafés y galerías.","g":"","s0":0,"o":0,"i":["La pasarela comercial a la sombra del Duomo.","Trazada en el siglo XIX como arteria peatonal y comercial que conectaba la Piazza del Duomo con la Piazza San Babila.","Flanqueada por soportales de estilo neoclásico y racionalista que protegen escaparates de firmas internacionales.","Fue la primera calle de Milán en ser cubierta con iluminación de gas a mediados del siglo XIX.","Fíjate en las esculturas y bajorrelieves incrustados en los soportales de la zona cercana a San Babila."],"v":"Espacio público: acceso libre."},{"k":"S","id":"d2x30","n":"Piazza del Duomo","z":"Milano","p":[45.4641,9.1919],"d":10,"q":"Piazza del Duomo Milano","a":"Gran plaza monumental y centro geométrico y emocional de la ciudad de Milán. Centro de la ciudad: el Duomo, la Galleria y el Palazzo Reale se abren a ella. Punto de encuentro de milaneses y turistas. Su aspecto actual se debe a reformas del siglo XIX. En el centro está el monumento a Víctor Manuel II y bajo ella se cruzan las líneas de metro M1 y M3.","g":"","s0":0,"o":0,"i":["El monumental escenario de mármol de Milán.","Configurada en su forma actual a finales del siglo XIX por el arquitecto Giuseppe Mengoni, quien diseñó un espacio monumental para ensalzar la catedral.","Gran explanada rectangular presidida por la estatua ecuestre de Vittorio Emanuele II y delimitada por palacios neoclásicos con soportal.","Durante su remodelación en el siglo XIX se demolieron barrios medievales enteros para dar la amplitud deseada al templo.","Busca el contraste entre el pavimento geométrico de granito y la fachada de mármol rosa de la catedral."],"v":"Espacio público: acceso libre."},{"k":"M","id":"d2lunch","n":"Almuerzo: Panzerotti o pizza al taglio","e":"🍽️","d":30,"at":0,"q":"Panzerotti","a":"Panzerotti: empanadilla frita de masa de pizza rellena de tomate y mozzarella, ideal para comer caminando junto al Duomo."},{"k":"S","id":"d2x31","n":"Catedral de Milán (Duomo di Milano)","z":"Milano","p":[45.4642,9.1916],"d":75,"q":"Duomo di Milano","a":"Catedral de gótico flamígero con 135 agujas, 3.400 estatuas y la icónica Madonnina. Empezó en 1386. Es de mármol de Candoglia, con 135 agujas y unas 3.400 estatuas, y en lo alto brilla la Madonnina dorada. Las terrazas permiten pasear entre las agujas.","g":"","s0":0,"o":0,"i":["El bosque de agujas de mármol rosa.","Iniciado en 1386 por iniciativa de Gian Galeazzo Visconti y completado bajo las órdenes de Napoleón en el siglo XIX. Es una de las catedrales góticas más grandes del mundo.","Gótico flamígero en mármol de Candoglia. Cuenta con 135 agujas y más de 3.400 estatuas que coronan su exterior.","En la aguja más alta brilla la Madonnina, estatua de cobre dorado que tradicionalmente ningún edificio de la ciudad podía superar en altura.","Sube a las terrazas del tejado para caminar entre los arbotantes y observar de cerca las gárgolas esculpidas."],"v":"09–19 h, ~22 € combo, reserva online.","u":"https://www.duomomilano.it"},{"k":"S","id":"d2x32","n":"Galleria Vittorio Emanuele II","z":"Milano","p":[45.4656,9.19],"d":20,"q":"Galleria Vittorio Emanuele II Milano","a":"Galería comercial del siglo XIX con imponente cúpula de hierro y cristal y el mosaico del toro. Dad 3 vueltas sobre el toro para la suerte. Inaugurada en 1867 y obra de Giuseppe Mengoni, une la plaza del Duomo con la Scala bajo una cúpula de hierro y cristal.","g":"","s0":0,"o":0,"i":["El salón de cristal de la burguesía milanesa.","Diseñada por Giuseppe Mengoni y construida entre 1865 y 1877 para conectar el Duomo con La Scala.","Estructura en cruz de hierro y vidrio con estilo neorrenacentista, rematada por una cúpula central de vidrio.","En el mosaico central del suelo se representa al toro de Turín; la tradición dice que dar tres vueltas sobre el talón derecho en su atributo da suerte.","Mira hacia las lunetas pintadas bajo la cúpula central que representan los cuatro continentes."],"v":"Espacio público: acceso libre."},{"k":"S","id":"d2x33","n":"Teatro alla Scala","z":"Milano","p":[45.4674,9.1895],"d":20,"q":"Teatro alla Scala Milano","a":"Templo mundial neoclásico de la ópera fundado en 1778. Inaugurado en 1778 con proyecto de Piermarini, es uno de los teatros de ópera más prestigiosos del mundo. Aquí se estrenaron obras de Verdi y Puccini, y la temporada empieza cada 7 de diciembre.","g":"","s0":0,"o":0,"i":["El templo mundial de la ópera y el bel canto.","Inaugurado en 1778 sobre el solar de la antigua iglesia de Santa Maria alla Scala. Ha sido el escenario de estrenos de Verdi, Puccini y Bellini.","Fachada neoclásica austera diseñada por Giuseppe Piermarini. Su interior destaca por su patio de caballos en forma de herradura con palcos dorados y terciopelo rojo.","Posee una acústica legendaria lograda mediante la cavidad cóncava dispuesta bajo el suelo de la orquesta.","Admira la gigantesca araña de cristal de Bohemia que cuelga del techo de la sala principal."],"v":"Exterior libre; museo 10–18 h, ~12 €.","u":"https://www.teatroallascala.org"},{"k":"S","id":"d2x34","n":"Piazza Mercanti","z":"Milano","p":[45.4654,9.1869],"d":10,"q":"Piazza Mercanti Milano","a":"Corazón medieval de Milán, con el antiguo Palazzo della Ragione. Plaza porticada del siglo XIII, antiguo centro cívico y comercial.","g":"","s0":0,"o":0,"i":["El rincón medieval congelado en el tiempo.","Fue el centro político y comercial de Milán en la Edad Media. Conserva la escala y trazado de la ciudad comunal.","Destaca el Palazzo della Ragione (Broletto Nuovo) y la Loggia degli Osii, con arcos de mármol blanco y negro.","La acústica de sus arcos permite escuchar un susurro emitido en un pilar situado en el lado opuesto de la galería.","Busca el relieve de una cerda cubierta de lana (scrofa semilanuta) en el Palazzo della Ragione, antiguo símbolo celta de la ciudad."],"v":"Entrada libre, a un minuto del Duomo."},{"k":"S","id":"d2x35","n":"Quadrilatero / Pinacoteca di Brera","z":"Milano","p":[45.472,9.188],"d":40,"q":"Pinacoteca di Brera||Palazzo di Brera Milano||Brera Milano cortile","a":"Barrio de la alta costura y la bohemia con la Pinacoteca di Brera (Rafael, Caravaggio, Mantegna). Las calles de Montenapoleone concentran la moda; Brera, vecino, es un barrio de callejones adoquinados y galerías. La Pinacoteca guarda obras maestras como el Cristo muerto de Mantegna y el Beso de Hayez.","g":"","s0":0,"o":1,"i":["El cruce de caminos entre la alta costura y los maestros de la pintura.","El Quadrilatero es el distrito mundial de la moda, mientras que el cercano Palazzo Brera alberga una de las colecciones de arte más importantes de Italia, fundada por Napoleón.","Palacios barrocos y neoclásicos con elegantes patios con columnas.","En la Pinacoteca de Brera se conserva \"El Beso\" de Francesco Hayez y \"Lamentación sobre Cristo muerto\" de Mantegna.","En el patio central de Brera, contempla la estatua de bronce de Napoleón representada como Marte pacificador por Antonio Canova."],"v":"Pinacoteca ~15 €, con reserva previa.","u":"https://pinacotecabrera.org"},{"k":"S","id":"d2x36","n":"Via Dante","z":"Milano","p":[45.4663,9.1856],"d":5,"q":"Via Dante Milano","a":"Paseo peatonal flanqueado por palacetes del siglo XIX que conecta con la fortaleza. Paseo peatonal entre el Duomo y el Castello Sforzesco, con terrazas y palacios del siglo XIX. Trazada a finales del siglo XIX, une el centro con el Castello y es una de las calles más agradables para caminar sin prisa.","g":"","s0":0,"o":0,"i":["El paseo peatonal hacia la fortaleza de los Sforza.","Trazada a finales del siglo XIX para unir comercial y visualmente la Piazza Cordusio con el Castello Sforzesco.","Edificios de estilo ecléctico y neorrenacentista con decoración escultórica exuberante en sus portadas.","Fue diseñada siguiendo las grandes corrientes de renovación urbana inspiradas en los bulevares parisinos.","Observa la alineación visual perfecta desde el inicio de la calle hasta la torre central del Castillo Sforzesco."],"v":"Espacio público: acceso libre."},{"k":"S","id":"d2x37","n":"Castello Sforzesco","z":"Milano","p":[45.4705,9.1795],"d":45,"q":"Castello Sforzesco Milano","a":"Fortaleza militar del siglo XV construida por los Visconti y Sforza, con la Torre del Filarete. Fortaleza de los Sforza donde trabajó Leonardo. Levantado por los Visconti en el siglo XIV y reconstruido por Francesco Sforza desde 1450, fue residencia ducal y cuartel. Hoy aloja museos, entre ellos la Pietà Rondanini de Miguel Ángel.","g":"","s0":0,"o":0,"i":["El bastión renacentista de los duques de Milán.","Levantado en el siglo XIV por los Visconti y reconstruido en el XV por Francesco Sforza. Fue una de las fortalezas militares más grandes de Europa.","Muros de ladrillo rojo, torres cuadradas y cilíndricas, fosos y patios interiores diseñados con aportaciones de Leonardo da Vinci.","Alberga la célebre Piedad Rondanini, la última obra maestra inacabada de Miguel Ángel.","En la Sala delle Asse, observa los frescos del techo atribuibles a Leonardo da Vinci que simulan una pérgola de ramas entretejidas."],"v":"Patios gratis 07–19:30; museos ~5 €.","u":"https://www.milanocastello.it"},{"k":"S","id":"d2x38","n":"Parco Sempione y Arco della Pace","z":"Milano","p":[45.4749,9.1717],"d":20,"q":"Arco della Pace Milano","a":"Gran parque urbano de 38 hectáreas rematado por el arco de triunfo neoclásico. Pulmón verde que termina en el arco napoleónico. Parque público de unas 38 hectáreas, diseñado en el siglo XIX sobre la antigua plaza de armas del Castello. En su extremo se levanta el Arco della Pace, arco triunfal neoclásico terminado en 1838.","g":"","s0":0,"o":0,"i":["El pulmón verde ducal y el portal de la victoria.","El parque fue diseñado en 1893 sobre el antiguo campo de maniobras militar del castillo. El arco triunfal se inició bajo Napoleón y se concluyó con los austríacos.","Parque de estilo inglés. El arco es de estilo neoclásico en granito y mármol, coronado por la Sestiga de la Paz (carro de seis caballos de bronce).","La posición de los caballos del arco fue modificada por los austríacos para que sus traseros dieran hacia la frontera con Francia.","Contempla los bajorrelieves del arco que narran las batallas napoleónicas y el Congreso de Viena."],"v":"Espacio público: acceso libre."},{"k":"S","id":"d2x39","n":"columnas de san lorenzo","z":"Milano","p":[45.4587,9.1822],"d":10,"q":"Colonne di San Lorenzo Milano","a":"Dieciséis columnas romanas del siglo II–III d.C. frente a la basílica de San Lorenzo. Las Colonne di San Lorenzo, del siglo II–III d.C., son un resto del Milán imperial. Se cree que formaban parte de un edificio de la época en que la ciudad fue capital imperial.","g":"","s0":0,"mt":[15,0.5,1.3],"o":0,"i":["Los restos de la Mediolanum imperial.","Conjunto de 16 columnas corintias romanas del siglo II trasladadas a este emplazamiento en el siglo IV para anteceder a la Basílica de San Lorenzo.","Columnas de mármol con capiteles corintios originales que soportan un arquitrabe romano reconstruido.","Es uno de los pocos testimonios arquitectónicos de la época romana que sobrevivió a los saqueos medievales de la ciudad.","Examina las marcas de cantería y desgaste en la base de las columnas traídas de un antiguo edificio público romano."],"v":"Entrada libre; en las noches de verano se llenan de gente joven."},{"k":"S","id":"d2x40","n":"Los Navigli (Naviglio Grande y Pavese)","z":"Milano","p":[45.4506,9.1735],"d":50,"q":"Naviglio Grande Milano","a":"Antiguos canales navegables convertidos en barrio de ocio. Ambiente especialmente bonito al atardecer, con terrazas junto al canal. Los Navigli fueron la red de canales de Milán. El Naviglio Grande, de origen medieval, llevó agua y mercancías, entre ellas el mármol del Duomo; a Leonardo da Vinci se le atribuyen mejoras en las esclusas. El Vicolo dei Lavandai conserva el antiguo lavadero de piedra.","g":"","s0":0,"o":0,"i":["Los canales de agua que construyeron Milán.","Sistema de canales navegables proyectado en la Edad Media para conectar Milán con los ríos Ticino y Po.","Obras hidrológicas complejas con esclusas diseñadas por Leonardo da Vinci. Flanqueadas por casas de vecinos tradicionales (case di ringhiera).","Por estos canales se transportaron en gabarras los bloques de mármol desde las canteras para construir el Duomo.","En el Vicolo dei Lavandai, observa las piletas de piedra donde las lavanderas limpiaban la ropa hasta mediados del siglo XX."],"v":"Metro M2 Cadorna → Porta Genova (2,20 €)."},{"k":"M","id":"d2x41","e":"🍽️","d":90,"at":1200,"n":"Cena: Risotto alla milanese o Cotoletta","a":"Dos pilares de la cocina milanesa: El Risotto alla milanese, arroz cremoso preparado con tuétano de ternera y azafrán que le da su icónico color dorado; y la Cotoletta alla milanese, chuleta de ternera con hueso, empanada y frita en abundante mantequilla clarificada.","q":"Risotto alla milanese"}]},{"tl":"Como","n":3,"t":"Monza, Como y el lago","e":"⛵","q":"Lago di Como","s":540,"h":{"Como":[45.81,9.086]},"items":[{"k":"T","id":"d3x42","n":"Brianza","q":"Brianza","a":"Comarca al norte de Milán entre lagos y colinas, con villas y parques históricos. La Brianza es la zona residencial y verde entre Milán y los lagos. Monza es su ciudad más conocida. Su paisaje de colinas con villas aristocráticas y parques fue refugio de la nobleza milanesa. Hoy une tradición industrial, deporte (Monza) y excursiones en bici.","pn":"La región de Monza y Brianza se extiende al norte de Milán hacia los lagos. Históricamente elegida por la realeza lombarda y austríaca como residencia estival por su clima y frondosos bosques, hoy es un próspero centro industrial y residencial que conserva parques señoriales de nivel europeo."},{"k":"R","id":"d3r44","e":"🚗","n":"Milán → Monza (SS36)","d":40,"km":18,"at":0,"x":"Salida temprana (09:00): recogida del coche de alquiler en la Estación Central y trayecto rápido por la SS36 (~18 km). Aparcamiento cerca del centro histórico de Monza. Si vais justos de tiempo, esta parada se puede saltar con el botón «Quitar».","tm":"","g":""},{"k":"T","id":"d3x45","n":"Monza","q":"Monza città","a":"Ciudad lombarda famosa por su catedral con la Corona de Hierro y por el Autódromo. A 18 km de Milán, con un centro histórico peatonal y un enorme parque real. Su Autódromo, dentro del Parque Real, es uno de los más míticos de la Fórmula 1.","pn":""},{"k":"S","id":"d3x46","n":"Catedral de Monza (Duomo di Monza)","z":"Monza","p":[45.5845,9.2744],"d":20,"q":"Duomo di Monza","a":"Joya del gótico lombardo en mármol blanco y verde donde se custodia la Corona de Hierro. Parada opcional de 20–30 min. Catedral gótica de los siglos XIII–XIV con fachada bicolor. Guarda la Corona de Hierro, con la que fueron coronados reyes de Italia. La capilla de Teodolinda conserva frescos del siglo XV.","g":"","s0":0,"o":1,"i":["El santuario sagrado de la Corona de Hierro.","Fundada a finales del siglo VI por la reina Teodolinda de los lombardos. El edificio actual combina remodelaciones góticas y barrocas.","Fachada de mármol blanco y verde con franjas horizontales, rosetón gótico tallado y capilla con frescos del gótico internacional (Hermanos Zavattari).","Custodia la Corona de Hierro, empleada en la coronación de los reyes de Italia y emperadores del Sacro Imperio, la cual contiene un clavo que la tradición atribuye a la Verdadera Cruz.","Contempla el relieve del tímpano sobre la puerta principal con la representación de la reina Teodolinda ofreciendo tesoros a San Juan Bautista."],"v":"Entrada a la catedral gratuita; capilla de Teodolinda y museo de pago (consultad).","u":"https://www.duomomonza.it"},{"k":"S","id":"d3x47","n":"Parque de Monza","z":"Monza","p":[45.585,9.2752],"d":10,"q":"Villa Reale Monza||Parco di Monza viale||Monza Villa Reale giardini","a":"Extenso parque histórico que alberga el legendario circuito de velocidad. Con la Villa Reale y el Autodromo Nazionale, es uno de los mayores parques cerrados de Europa. Aquí solo hay tiempo para una pasada rápida en coche por la entrada, camino de la autopista. Rodeado por un muro de 14 km, el parque nació en el siglo XIX alrededor de la Villa Reale. Dentro, el Autódromo de Monza es sede histórica de la Fórmula 1.","g":"","s0":0,"o":1,"i":["El inmenso bosque real flanqueado por la velocidad.","Creado por Eugène de Beauharnais (virrey de Italia y ahijado de Napoleón) en 1805 como reserva de caza y parque complementario a la Villa Real.","Uno de los parques amurallados más grandes de Europa. Combina paisajes ajardinados, villas históricas y el famoso Autódromo Nacional de Monza.","El muro perimetral de ladrillo de más de 14 kilómetros de largo se construyó utilizando ruinas de las antiguas murallas medievales de Monza.","Recorre la avenida de robles centenarios que conduce hacia la fachada posterior de la neoclásica Villa Real."],"v":"Entrada a pie al parque libre; la Villa Reale y el Autódromo se visitan aparte (de pago)."},{"k":"R","id":"d3r49","e":"🚗","n":"Monza → Como (SS36 / A9)","d":40,"km":38,"at":0,"x":"Salida de Monza hacia Como por la SS36 y A9 (~38 km, 40 min). Aparcad en el parking privado del hotel.","tm":"","g":""},{"k":"R","id":"d3r50","e":"🏨","n":"Check-in en el hotel de Como + paseo al embarcadero","d":35,"km":0,"at":0,"x":"Registro, dejar maletas y paseo a pie hasta el embarcadero de Piazza Cavour (unos 10 min).","tm":"","g":""},{"k":"T","id":"d3x51","n":"Lago di Como","q":"Lago di Como","a":"Uno de los lagos más bellos del mundo, con forma de Y invertida, rodeado de montañas y villas. Más de 400 m de profundidad, pueblos de postal y ferries que unen las orillas. Aquí se mueve todo en barco. Excavado por un glaciar, el Lario es uno de los lagos más profundos de Europa. Sus orillas se llenaron de villas patricias desde la época romana; los ferries son la mejor forma de verlas.","pn":"Famoso desde la época del Imperio Romano por albergar las villas de retiro de Plinio el Viejo y Plinio el Joven, el Lago de Como es una profunda fosa tectónica rodeada de imponentes montañas. Sus pueblos ribereños conservan un aire refinado que atrajo a poetas del Romanticismo como Lord Byron y Stendhal, manteniéndose como uno de los destinos turísticos más codiciados del planeta."},{"k":"R","id":"d3r53","e":"⛴️","n":"BARCO: Como → Tremezzo (hidrofoil)","d":50,"km":25,"at":690,"x":"Desde el embarcadero de Piazza Cavour. Servicio Rápido (aliscafo) entre villas históricas, ~50 min. Billete ~14,80 €/p. Embarcad a las 11:30.","tm":"","g":"","u":"https://www.navigazionelaghi.it"},{"k":"T","id":"d3x54","n":"Tremezzo","q":"Tremezzo città","a":"Pueblo de la «Riviera de las Azaleas», con la Villa Carlotta y su jardín botánico. Embarcadero y villa a cinco minutos a pie. Un sitio muy tranquilo, ideal para comer junto al agua. Tremezzo ocupa la orilla occidental, frente a Bellagio, con vistas a las montañas. La Villa Carlotta es su joya: jardines botánicos y arte neoclásico.","pn":""},{"k":"S","id":"d3x55","n":"Villa Carlotta (Tremezzo)","z":"Tremezzo","p":[45.9866,9.2252],"d":70,"q":"Villa Carlotta Tremezzo","a":"Residencia neoclásica en Tremezzo con obras de Canova y 8 hectáreas de jardín botánico. Villa neoclásica, 8 ha de jardines y esculturas de Canova. Construida a finales del siglo XVII, debe su nombre a Carlota de Prusia, que la recibió como regalo de boda en 1850. Guarda esculturas neoclásicas de Canova y Thorvaldsen y un jardín botánico famoso por sus azaleas y rododendros.","g":"","s0":0,"o":0,"i":["El jardín botánico del arte neoclásico.","Villa construida a finales del siglo XVII para el marqués Giorgio Clerici, famosa por sus colecciones de arte y su frondoso jardín botánico de 7 hectáreas.","Edificio neoclásico que alberga esculturas originales de Antonio Canova y Bertel Thorvaldsen, rodeado de terrazas ajardinadas con fuentes y escalinatas.","En la primavera, sus jardines albergan una célebre floración de más de 150 variedades de azaleas y rododendros.","Busca la escultura de \"Palamedes\" de Antonio Canova colocada en la sala con vistas al lago."],"v":"10–19 h, ~15 € (~8 € adolescentes).","u":"https://www.villacarlotta.it"},{"k":"M","id":"d3x56","e":"🍽️","d":40,"at":0,"n":"Almuerzo: Panini o Focaccia","a":"En los trayectos en barco por el lago, el almuerzo tradicional consiste en focaccia esponjosa horneada con aceite de oliva y romero, o un panino de pan crujiente relleno de embutidos tradicionales lombardos como la Bresaola della Valtellina con queso Gorgonzola.","q":"Focaccia ligure"},{"k":"S","id":"d3x57","n":"villa balbanello","z":"Tremezzo","p":[45.9883,9.2244],"d":100,"q":"Villa del Balbianello||Villa Balbianello Lenno||Balbianello lago di Como","a":"Villa del XVIII en una península, escenario de películas. Incluye ida y vuelta en taxi acuático desde Tremezzo (~100 min en total). Situada en la punta de Lavedo, cerca de Lenno, es una de las villas más fotografiadas del lago, con jardines escalonados y una loggia sobre el agua. Acceso en barco o a pie por un sendero.","g":"","s0":0,"bk":6,"o":1,"i":["El balcón romántico esculpido en el promontorio.","Erigida en 1787 sobre las ruinas de un monasterio franciscano por el cardenal Angelo Maria Durini.","Complejo arquitectónico adaptado a las rocas del promontorio de Lavedo, coronado por una loggia de tres arcos cubierta de trepadoras.","Ha sido escenario cinematográfico de películas como Star Wars: Episodio II y Casino Royale.","Contempla la enorme encina podada con forma de sombrilla perfecta que domina una de las terrazas superiores."],"v":"~12 € de entrada, reserva imprescindible.","u":"https://fondoambiente.it/luoghi/villa-del-balbianello"},{"k":"R","id":"d3r59","e":"⛴️","n":"BARCO: Tremezzo → Bellagio (ferry de cruce)","d":20,"km":5,"at":0,"x":"Ferry corto por el lago (~15–20 min, ~4,60 €/p). Comprobad horarios en el embarcadero, sobre todo si hacéis la visita opcional al Balbianello.","tm":"","g":"","u":"https://www.navigazionelaghi.it"},{"k":"T","id":"d3x60","n":"Bellagio","q":"Bellagio città","a":"La «Perla del Lago», sobre el promontorio donde el lago se divide en dos brazos. Calles empedradas y escalonadas, tiendas de seda y vistas espectaculares desde los jardines de Punta Spartivento. Bellagio ocupa la punta de la península que separa los brazos de Como y Lecco. Las escalinatas bajan hasta el agua entre casas de colores. Es uno de los pueblos más fotografiados del norte de Italia.","pn":""},{"k":"S","id":"d3x61","n":"Salita Serbelloni","z":"Bellagio","p":[45.9867,9.2612],"d":25,"q":"Salita Serbelloni Bellagio","a":"Pintorescas escalinatas de piedra y callejones de la 'Perla del Lago'. Callejuelas con tiendas de seda y artesanía local. Se recorre en 20–30 min. Esta calle escalonada baja hasta el lago entre fachadas de colores. Aquí está la mejor muestra del comercio tradicional de Bellagio: seda, madera y cerámica.","g":"","s0":0,"o":0,"i":["La perla del lago entre escalinatas de piedra.","Situada justamente en la bifurcación de los tres brazos del lago de Como. Su trazado medieval de callejuelas empinadas data del siglo XII.","La Salita Serbelloni es una escalinata peatonal empedrada flanqueada por fachadas de colores pastel, boutiques de seda y arcos de piedra.","Su posición estratégica la convirtió en un punto de vigilancia clave controlado sucesivamente por celtas, romanos y lombardos.","Mira hacia abajo desde la parte alta de Salita Serbelloni para encuadrar los escalones con las fachadas de colores y el lago al fondo."],"v":"Calle pública: acceso libre."},{"k":"S","id":"d3x62","n":"Punta Spartivento","z":"Bellagio","p":[45.9825,9.265],"d":25,"q":"Punta Spartivento Bellagio","a":"Mirador panorámico situado en el extremo del promontorio donde se dividen los brazos del lago. Jardines públicos con vistas a los dos brazos del lago, el de Como y el de Lecco. Es uno de los mejores atardeceres de la zona.","g":"","s0":0,"o":0,"i":["Donde las aguas del lago se dividen en dos.","Es el extremo geográfico del promontorio de Bellagio donde la cuenca del lago de Como se divide en el brazo de Como y el de Lecco.","Pequeño parque natural arbolado reforzado con espigones de piedra y una plataforma de observación.","Su nombre significa literalmente \"divide vientos\", debido a las corrientes de aire alpino que convergen en este vértice.","Observa las montañas del norte al fondo mientras ves la bifurcación de las aguas en forma de \"Y\" invertida."],"v":"Jardines públicos: acceso libre."},{"k":"R","id":"d3r64","e":"⛴️","n":"BARCO: Bellagio → Como (aliscafo)","d":55,"km":28,"at":1050,"x":"Barco rápido (aliscafo / hidrodeslizador) a las 17:30, ~55 min. Es el último tramo del día: no lo perdáis. Confirmad precio en taquilla.","tm":"","g":"","u":"https://www.navigazionelaghi.it"},{"k":"T","id":"d3x65","n":"Como","q":"Como città","a":"Ciudad de la seda a orillas del lago, con catedral de mármol blanco. Casco antiguo peatonal y paseo lacustre. Desde aquí salen los barcos a las villas. Como fue romana (Novum Comum, fundada por Julio César) y capital de la seda durante siglos. Su centro medieval se recorre en poco tiempo y su lago es el eje de la vida local.","pn":""},{"k":"M","id":"d3x66","e":"🍹","d":40,"at":0,"n":"Aperitivo","a":"Spritz o bebida fresca con unos aperitivos (stuzzichini) al atardecer.","q":"Spritz aperitivo"},{"k":"S","id":"d3x67","n":"Piazza del Duomo y Duomo di Como","z":"Como","p":[45.8104,9.0848],"d":30,"q":"Duomo di Como","a":"Plaza histórica y catedral gótico-renacentista de mármol blanco en el centro de Como. Su construcción duró casi cuatro siglos (1396–1770), por eso mezcla gótico, Renacimiento y barroco. Es de mármol blanco y en la fachada destacan las estatuas de Plinio el Viejo y Plinio el Joven, ambos nacidos en Como.","g":"","s0":0,"o":0,"i":["La fachada gótica que abraza al poder civil.","La construcción del Duomo comenzó en 1396 y duró casi 400 años, situándose codo con codo con el Broletto (antiguo ayuntamiento).","Fachada gótico-renacentista de mármol blanco con estatuas de Plinio el Viejo y Plinio el Joven (personajes paganos colocados a los lados de la portada principal). Cúpula neoclásica diseñada por Filippo Juvarra.","Es uno de los pocos templos católicos en cuya fachada principal se rinde homenaje a autores paganos romanos.","Examina las estatuas sedentes de los dos Plinios encuadradas en hornacinas a ambos lados de la puerta principal."],"v":"Catedral: entrada libre (respetad los horarios de culto)."},{"k":"M","id":"d3x68","e":"🍽️","d":90,"at":1200,"n":"Cena: Risotto con filetto di pesce persico o Polenta","a":"La especialidad del lago por excelencia: Risotto con filetto di pesce persico, risotto mantecado servido con filetes salteados de perca fresca del lago; o la Polenta uncia, harina de maíz cocida y enriquecida con abundante queso de montaña local (Latteria) y mantequilla aromatizada con ajo y salvia.","q":"Risotto pesce persico"}]},{"tl":"Verona","n":4,"t":"Sirmione y Verona","e":"💘","q":"Verona Arena","s":600,"h":{"Verona":[45.4452,10.9985]},"items":[{"k":"D","n":"De Lombardia A Véneto"},{"k":"R","id":"d4r71","e":"🚗","n":"Como → Sirmione (A4)","d":105,"km":150,"at":0,"x":"Conducción directa desde Como por la autopista A4 hacia la península de Sirmione (~150 km, ~1 h 40 min). Salida a las 10:00.","tm":"","g":""},{"k":"T","id":"d4x72","n":"Sirmione","q":"Sirmione città","a":"Península estrecha sobre el lago de Garda, con castillo y villa romana. Pueblo peatonal medieval dentro de un foso. El coche se deja fuera, en parking. Sirmione ocupa una lengua de tierra de unos 4 km que se adentra en el Garda, el mayor lago de Italia. Catulo, poeta romano, tuvo aquí una casa. Sus termas son conocidas desde hace siglos.","pn":"Ubicado en el extremo sur del Lago de Garda, Sirmione ocupa una fina península de 4 kilómetros que se adentra en el agua. Poblada desde la prehistoria, fue la zona turística preferida por la aristocracia romana, conservando restos arqueológicos de primer orden y una imponente fortaleza medieval veneciana."},{"k":"S","id":"d4x73","n":"Istmo de Sirmione","z":"Sirmione","p":[45.4905,10.6075],"d":10,"q":"Sirmione penisola||Sirmione Castello Scaligero ponte||Sirmione lago di Garda","a":"Estrecho acceso fortificado a la península de Sirmione, sobre el Garda. El casco antiguo de Sirmione ocupa una estrecha lengua de tierra de unos 4 km que se adentra en el lago de Garda. El único acceso al pueblo es un puente sobre un foso, junto a la fortaleza.","g":"","s0":0,"o":0,"i":["La puerta de agua de la península.","Sirmione ocupa una estrecha lengua de tierra de unos 4 km que se adentra en el lago de Garda. El único acceso al casco histórico es el istmo que parte de la fortaleza escaligera, cruzando el foso por un puente.","El casco antiguo es peatonal, de callejuelas empedradas y casas de piedra que se asoman al agua. La Rocca Scaligera marca la entrada y su silueta con almenas se refleja en el lago.","Los romanos de clase alta veraneaban aquí, y la tradición vincula la península con el poeta Catulo. Las aguas termales de la zona se conocen desde hace siglos.","Cruza el puente del foso despacio y mira hacia atrás: la fortaleza y las barcas amarradas forman la postal clásica de Sirmione."],"v":"Entrada a pie a la península; casco histórico peatonal."},{"k":"S","id":"d4x74","n":"Castello Scaligero (Sirmione)","z":"Sirmione","p":[45.4917,10.6087],"d":35,"q":"Castello Scaligero Sirmione","a":"Fortaleza medieval rodeada por las aguas del Lago de Garda. Rocca construida por los Della Scala de Verona en los siglos XIII–XIV como fortaleza portuaria, con puerto interior, torre de unos 47 m y acceso por puente levadizo. Es uno de los castillos lacustres mejor conservados de Italia.","g":"","s0":0,"o":0,"i":["La fortaleza flotante de los señores de Verona.","Construido en el siglo XIV por la familia Della Scala (Scaligeri) de Verona para proteger su puerto estratégico y controlar la navegación en el lago.","Ejemplo excepcional de fortificación lacustre medieval con almenas góticas en forma de cola de golondrina, torre del homenaje y una dársena defensiva fortificada única en su tipo.","La dársena interior estaba diseñada para resguardar la flota de la fortaleza frente a los ataques sorpresa de las tropas de Milán o Venecia.","Camina por las rondas de la muralla para observar cómo el agua azul del lago penetra directamente en el foso del castillo."],"v":"Exterior libre, interior ~6 €. Comida al paso ~10–12 €/p."},{"k":"S","id":"d4x75","n":"grotte di catullo","z":"Sirmione","p":[45.502,10.609],"d":45,"q":"grotte di catullo Sirmione","a":"Ruinas de una gran villa romana sobre el lago, en el extremo norte de la península. Son ~1,2 km a pie desde el castillo. Pese al nombre, las Grotte di Catullo son los restos de una enorme villa romana de los siglos I a.C.–I d.C., situada en el extremo de la península de Sirmione. Es el mejor ejemplo de villa romana de lujo del norte de Italia.","g":"","s0":0,"o":1,"i":["Las ruinas imperiales sobre el acantilado de olivos.","Extensa villa romana construida entre el siglo I a.C. y el siglo I d.C. Tradicionalmente vinculada al poeta Catulo, quien tenía una propiedad en la zona.","Los restos de la villa residencial ocupan más de dos hectáreas. Conserva pórticos de piedra, criptopórticos subterráneos y terrazas panorámicas sobre el lago.","El nombre \"Grotte\" (grutas) proviene de los descubridores del Renacimiento que, al ver las ruinas cubiertas de vegetación, pensaron que se trataba de cuevas naturales.","Sitúate en la arcada del gran criptopórtico para encuadrar la panorámica sobre las aguas cristalinas del lago."],"v":"Entrada ~8 €."},{"k":"M","id":"d4x76","e":"🍽️","d":40,"at":0,"n":"Almuerzo: Piadine, Focaccias o Ensaladas","a":"Para una comida ligera a orillas del Lago de Garda: Piadina, pan plano romañolo servido caliente y relleno de queso Provolone, jamón de Parma y rúcula; o ensaladas frescas aliñadas con el apreciado aceite de oliva virgen extra con Denominación de Origen del Lago de Garda.","q":"Piadina romagnola"},{"k":"R","id":"d4r78","e":"🚗","n":"Sirmione → Verona","d":40,"km":35,"at":0,"x":"Conducción final de Sirmione a Verona (~35 km, 40 min).","tm":"","g":""},{"k":"R","id":"d4r79","e":"🏨","n":"Check-in en Piazza Santa Anastasia (Verona)","d":30,"km":0,"at":0,"x":"Registro de matrícula en la ZTL (o aparcamiento en Parcheggio Isolo) e instalación.","tm":"","g":""},{"k":"T","id":"d4x80","n":"Verona","q":"Verona città","a":"Ciudad de Romeo y Julieta, con anfiteatro romano y palacios medievales. Centro histórico pequeño y llano, que se recorre a pie. Patrimonio de la Humanidad (UNESCO). Verona vivió bajo los Scaligeri (siglos XIII–XIV), que la llenaron de palacios y tumbas. Conserva un anfiteatro romano y un casco medieval compacto. La leyenda de Shakespeare la hizo mundialmente famosa.","pn":"Clasificada como Patrimonio de la Humanidad por la UNESCO, Verona prosperó como importante colonia romana debido a su ubicación en el cruce de vías imperiales. Alcanzó su mayor esplendor artístico bajo la señoría de los Scaligeri en los siglos XIII y XIV, quedando inmortalizada universalmente por William Shakespeare como el escenario de Romeo y Julieta."},{"k":"S","id":"d4x81","n":"Piazza e Iglesia de Santa Anastasia","z":"Verona","p":[45.4448,10.9979],"d":25,"q":"Basilica di Santa Anastasia Verona","a":"Templo mayor de los dominicos y principal monumento gótico de Verona con frescos de Pisanello. Gótico dominico con el San Jorge de Pisanello. Iglesia de los dominicos con la mayor bóveda gótica de Verona, empezada en 1290. Alberga el fresco de San Jorge y la princesa de Pisanello y los «gobbi», figuras agachadas que sostienen las pilas de agua bendita.","g":"","s0":0,"o":0,"i":["La catedral no oficial del gótico veronés.","Construida entre 1290 y 1481 por los dominicos con el mecenazgo de la familia Scaligeri. Es el templo religioso más grande de Verona.","Fachada de ladrillo rojo incompleta. El interior presenta tres naves sobreelevadas con columnas de mármol rojo de Verona y techos abovedados pintados con motivos vegetales.","En la capilla Pellegrini alberga el célebre fresco \"San Jorge y la Princesa\" de Pisanello, obra cumbre del gótico internacional.","Al cruzar la puerta, fíjate en las dos pilas de agua bendita sujetas por dos jorobados esculpidos en piedra (Gobbi di Santa Anastasia)."],"v":""},{"k":"S","id":"d4x82","n":"Arche Scaligere","z":"Verona","p":[45.4437,10.9979],"d":10,"q":"Arche Scaligere Verona","a":"Tumbas góticas de los señores de Verona (Cangrande I) con rejas de escaleras. Sepulcros góticos de la familia Scaligera, señores de Verona en los siglos XIII y XIV. Destaca la tumba de Cangrande I, y las rejas de hierro llevan el símbolo de la dinastía: la escalera (della Scala).","g":"","s0":0,"o":0,"i":["Los panteones de piedra que desafían la gravedad.","Conjunto funerario monumental erigido en el siglo XIV para albergar las tumbas de los señores de la familia Della Scala (Cangrande I, Mastino II y Cansignorio).","Obras maestras del arte gótico con baldaquinos labrados, pináculos, relieves bíblicos y estatuas ecuestres rodeadas por una verja de hierro forjado.","La verja de hierro forjado que rodea el complejo está compuesta por eslabones móviles que llevan repetido el símbolo de la escalera (scala), emblema de la dinastía.","Observa la estatua ecuestre original de Cangrande I con su sonrisa enigmática (la copia está sobre el sepulcro, el original en Castelvecchio)."],"v":"Complejo funerario gótico al aire libre con elaborados sarcófagos de la dinastía Scaligera."},{"k":"S","id":"d4x83","n":"Piazza dei Signori (Piazza Dante)","z":"Verona","p":[45.4433,10.9976],"d":10,"q":"Piazza dei Signori Verona","a":"Plaza señorial flanqueada por el Palazzo del Podestà y presidida por la estatua de Dante. Rodeada del Palazzo della Ragione, la Loggia del Consiglio y el Palazzo del Capitano. La estatua de Dante recuerda su exilio en Verona. Es el salón político de la Verona medieval.","g":"","s0":0,"o":0,"i":["El corazón aristocrático y literario de la Verona medieval.","Antiguo centro del poder político veronés flanqueado por los palacios de la familia Scaligeri y el ayuntamiento.","Plaza rodeada por el Palazzo del Podestà, el Palazzo del Capitano y la Loggia del Consiglio. En el centro se erige la estatua de Dante Alighieri de 1865.","Dante Alighieri residió en los palacios de esta plaza durante su exilio de Florencia, acogido por Cangrande I Della Scala.","Cruza bajo el Arco della Costa entre los palacios y observa el hueso de ballena o pez espada colgado del arco desde hace siglos."],"v":"Espacio público: acceso libre."},{"k":"S","id":"d4x84","n":"Piazza delle Erbe","z":"Verona","p":[45.4435,10.9969],"d":10,"q":"Piazza delle Erbe Verona","a":"Antiguo foro romano con la Torre dei Lamberti y la fuente barroca de Madonna Verona. Mercadillo diario. Heredera del foro romano, hoy es mercado y escenario de la vida veronesa. La fuente de Madonna Verona es romana, reformada en la Edad Media. Las fachadas están pintadas con frescos.","g":"","s0":0,"o":0,"i":["El antiguo foro romano repleto de color y frescura.","Ocupa el emplazamiento exacto del antiguo foro romano de la ciudad. Durante la Edad Media fue el mercado central de frutas y verduras.","Rodeada de palacios con frescos renacentistas, la Torre dei Lamberti y la fuente central de la Madonna Verona (siglo XIV).","La estatua de la fuente central es una escultura romana del siglo IV d.C. adaptada en la Edad Media con manos y atributos medievales.","Mira las fachadas pintadas de las Case Mazzanti que aún conservan vivos los frescos del siglo XVI."],"v":"Entrada a la Torre dei Lamberti ~8 € (con ascensor)."},{"k":"S","id":"d4x85","n":"Casa de Julieta (Casa di Giulietta)","z":"Verona","p":[45.4423,10.9977],"d":20,"q":"Balcone di Giulietta Verona||Juliet's balcony Verona||Casa di Giulietta cortile","a":"Palacete del siglo XIII con el famoso balcón de piedra y la estatua de bronce de Julieta. La «casa de Julieta» es un palacio gótico del siglo XIII asociado a la leyenda shakespeariana. El balcón se añadió en el siglo XX, pero el patio se ha convertido en lugar de peregrinación para enamorados.","g":"","s0":0,"o":0,"i":["El altar del mito romántico universal.","Edificio medieval del siglo XIII que perteneció a la familia Cappello (asociada por la tradición a los Capuleto de la obra de Shakespeare).","Fachada de ladrillo con el famoso balcón de piedra de mármol añadido a principios del siglo XX reutilizando un sarcófago medieval.","La escultura de bronce de Julieta en el patio interior atrae a miles de visitantes que tocan su pecho derecho buscando fortuna en el amor.","Lee los miles de mensajes de amor dejados por visitantes en las paredes del pasadizo de acceso."],"v":"Reserva previa obligatoria para entrar al patio (~2 €); la casa-museo es de pago aparte.","u":"https://casadigiulietta.comune.verona.it"},{"k":"S","id":"d4x86","n":"Porta Borsari","z":"Verona","p":[45.4421,10.9944],"d":10,"q":"Porta Borsari Verona","a":"Puerta de entrada a la Verona romana del siglo I d.C. con arcos de piedra blanca. Se atraviesa caminando hacia Piazza Bra. Su fachada, del siglo I d.C., tiene dos arcos y dos órdenes de ventanas.","g":"","s0":0,"o":0,"i":["La puerta monumental de la aduana romana.","Construida en el siglo I d.C. como la principal puerta de entrada a la ciudad romana desde la Via Postumia.","Fachada de piedra caliza blanca con dos arcos de paso en la base y dos pisos superiores decorados con ventanas superpuestas y pedimentos neoclásicos romanos.","Su nombre medieval proviene de los bursarii, los soldados de la guardia que cobraban los impuestos aduaneros en la puerta.","Observa la inscripción romana grabada en el arquitrabe que conmemora la reconstrucción de las murallas por el emperador Galieno."],"v":"Entrada libre."},{"k":"S","id":"d4x87","n":"Piazza Bra y Arena de Verona","z":"Verona","p":[45.439,10.9944],"d":50,"q":"Arena di Verona","a":"Anfiteatro romano del año 30 d.C. excelentemente conservado y sede de ópera. Construida hacia el año 30 d.C., la Arena es uno de los mayores anfiteatros romanos de Italia y acoge cada verano un festival de ópera. Se conserva parte del anillo exterior, el «ala».","g":"","s0":0,"o":0,"i":["El anfiteatro romano que resuena con la ópera.","La Arena fue construida en el siglo I d.C. para combates de gladiadores; la Piazza Bra se desarrolló posteriormente a su alrededor.","Anfiteatro de planta elíptica construido en piedra rosada de Valpolicella. Es uno de los anfiteatros romanos mejor conservados.","Un terremoto en 1117 destruyó casi todo el anillo exterior defensivo, dejando solo en pie la sección conocida como l'Ala.","Observa los tonos rosados de los sillares de mármol bajo la luz del atardecer en la fachada exterior."],"v":"","u":"https://www.arena.it"},{"k":"S","id":"d4x88","n":"Giardino Giusti","z":"Verona","p":[45.4451,11.0018],"d":40,"q":"Giardino Giusti Verona","a":"Jardín renacentista con laberinto de boj y mirador. Jardín manierista del siglo XV con cipreses centenarios, grutas y un laberinto de boj. Desde su mirador se ve toda Verona.","g":"","s0":1,"o":1,"i":["El oasis renacentista de cipreses y laberintos.","Diseñado en el siglo XVI como complemento del palacio de la familia Giusti. Visitado históricamente por Wolfgang Amadeus Mozart y Goethe.","Jardín de estilo renacentista italiano estructurado en terrazas, con cipreses centenarios, fuentes, estatuas mitológicas y un laberinto de setos de boj.","En la terraza superior del jardín hay un mascarón de piedra tallado en la roca de la colina que expulsa fuego por la boca en festejos.","Sube hasta el mirador de la gruta para obtener una vista enmarcada del bosque de cipreses con los campanarios de Verona de fondo."],"v":"Entrada ~10 €.","u":"https://www.giardinogiusti.it"},{"k":"S","id":"d4x89","n":"Castelvecchio y Ponte Scaligero","z":"Verona","p":[45.4396,10.9885],"d":45,"q":"Castelvecchio Ponte Scaligero Verona","a":"Fortaleza militar del siglo XIV y puente fortificado de ladrillo rojo sobre el río Adigio. Fortaleza de ladrillo rojo construida por Cangrande II della Scala entre 1354 y 1356, con almenas gibelinas. Hoy es museo, restaurado por Carlo Scarpa, y su puente fortificado cruza el Adigio.","g":"","s0":0,"o":0,"i":["El castillo fortificado y la fosa de mármol sobre el Adigio.","Construido entre 1354 y 1376 por Cangrande II Della Scala como fortaleza defensiva y vía de escape hacia el norte en caso de revueltas populares.","Edificio defensivo de ladrillo rojo con torres cuadradas y almenas góticas. El puente anexo presenta arcos rebajados de ladrillo y mármol rosado.","El puente fue volado por las tropas alemanas en retirada en 1945 y reconstruido minuciosamente piedra a piedra con los materiales originales recuperados del río.","Camina por el pasadizo fortificado del puente para ver cómo el diseño de las almenas impedía que se atacara el interior desde fuera."],"v":"Puente: paso libre. Museo de Castelvecchio: de pago (consultad horario y precio).","u":"https://museodicastelvecchio.comune.verona.it"},{"k":"M","id":"d4x90","e":"🍽️","d":90,"at":1200,"n":"Cena: Risotto all'Amarone, Bigoli con l'Anatra, Pastissada","a":"Grandes clásicos veroneses: Risotto all'Amarone, risotto preparado con el apreciado vino tinto Amarone della Valpolicella; Bigoli con l'Anatra, pasta gruesa tipo espagueti con hendiduras que absorben un espeso ragú de pato; y Pastissada de caval, estofado tradicional de carne de caballo marinada en vino tinto con especias y cocida a fuego lento.","q":"Risotto all'Amarone"}]},{"tl":"Padua","n":5,"t":"Padua y llegada a Venecia","e":"🚤","q":"Venezia Canal Grande","s":600,"h":{"Venezia":[45.4333,12.336]},"items":[{"k":"D","n":"Véneto"},{"k":"R","id":"d5r93","e":"🚗","n":"Verona → Padua (A4)","d":50,"km":85,"at":0,"x":"Desde Verona por la autopista A4, apenas 50 minutos (~85 km).","tm":"","g":""},{"k":"T","id":"d5x94","n":"Padua","q":"Padova città","a":"Ciudad universitaria del Véneto, con la basílica de San Antonio y los frescos de Giotto. Universidad fundada en 1222 (Galileo fue profesor). Centro peatonal con soportales. Padua es una de las ciudades universitarias más antiguas de Europa (1222). En ella enseñó Galileo. Conserva el ciclo de Giotto en la Capilla de los Scrovegni y la basílica del Santo.","pn":"Una de las ciudades más antiguas del norte de Italia (fundada según la leyenda por el troyano Antenor). Destaca mundialmente por su Universidad (fundada en 1222), donde impartió clases Galileo Galilei, y por albergar obras maestras que marcaron el inicio del Renacimiento en la pintura occidental."},{"k":"S","id":"d5x95","n":"Prato della Valle (Padua)","z":"Padova","p":[45.3978,11.8769],"d":25,"q":"Prato della Valle Padova","a":"Una de las plazas elípticas más grandes de Europa, rodeada por un canal con 78 estatuas. Plaza elíptica con 78 estatuas y el Santo con relieves de Donatello. Una isla elíptica rodeada por un canal alberga 78 estatuas de personajes ilustres, entre ellos Galileo y Petrarca. Antes de ser plaza fue teatro romano y feria.","g":"","s0":0,"o":0,"i":["La elipse monumental de estatuas y canales.","Diseñada a finales del siglo XVIII sobre un antiguo terreno pantanoso por el procurador Andrea Memmo. Es una de las plazas más grandes de Europa.","Isla central elíptica (Isola Memmia) rodeada por un canal de agua bordeado por dos anillos de 78 estatuas de personajes históricos vinculados a Padua.","Originalmente se proyectó colocar 88 estatuas, pero la caída de la República de Venecia dejó vacíos diez pedestales.","Busca entre las estatuas la figura de Galileo Galilei, quien vivió y enseñó en la ciudad durante 18 años."],"v":"Espacio público: acceso libre."},{"k":"S","id":"d5x96","n":"Basílica de San Antonio de Padua (Il Santo)","z":"Padova","p":[45.4017,11.8808],"d":40,"q":"Basilica di Sant'Antonio Padova","a":"Templo románico-gótico bizantino con 8 cúpulas que alberga la tumba del santo y relieves de Donatello. Plaza elíptica con 78 estatuas y el Santo con relieves de Donatello. Construida desde 1232, un año después de la muerte de San Antonio, combina elementos románicos, góticos y bizantinos en sus ocho cúpulas. Guarda la tumba del santo y relieves de bronce de Donatello en el altar mayor.","g":"","s0":0,"o":0,"i":["La cúpula bizantina que cobija la devoción del mundo.","Construida inmediatamente después de la muerte de San Antonio de Padua en 1231 para albergar sus reliquias.","Fusión fascinante de estilos: fachada románica, arcos góticos y ocho cúpulas de influencia bizantina junto con minaretes de estilo oriental. El altar mayor alberga bronces de Donatello.","La basílica no pertenece al Obispado de Padua, sino que es un territorio de la Santa Sede administrado por los frailes franciscanos.","En el interior de la capilla del Tesoro, observa la reliquia que conserva incorrupta la lengua del Santo."],"v":"Entrada libre. Hombros y rodillas cubiertos; no se admite ropa corta.","u":"https://www.basilicadelsanto.org"},{"k":"S","id":"d5x97","n":"Capilla de los Scrovegni","z":"Padova","p":[45.4118,11.8789],"d":60,"q":"Cappella degli Scrovegni Padova","a":"Los frescos de Giotto (1303–05). Giotto pintó entre 1303 y 1305 el ciclo de la vida de la Virgen y de Cristo, considerado el inicio de la pintura moderna. La capilla se visita en turnos cortos con control de humedad.","g":"","s0":0,"o":1,"i":["El cielo estrellado pintado por Giotto.","Encargada hacia 1303 por el rico banquero Enrico Scrovegni para expiar los pecados de usura de su padre.","Capilla de nave única iluminada por estrechas ventanas. Sus paredes conservan el ciclo de frescos más famoso de Giotto, considerado la chispa del Renacimiento por su innovador uso de la perspectiva y el realismo emocional.","Para proteger la conservación del pigmento azul lapislázuli de los frescos, la entrada a la capilla está regulada mediante una cámara de climatización previa.","Dirígete al panel del \"El Juicio Final\" en la pared de la entrada y busca a Enrico Scrovegni ofreciendo una maqueta de la capilla a la Virgen."],"v":"Entrada ~15 € con reserva estricta online.","u":"https://www.cappelladegliscrovegni.it"},{"k":"S","id":"d5x98","n":"Piazza delle Erbe y Palazzo della Ragione (Padua)","z":"Padova","p":[45.4069,11.8774],"d":30,"q":"Piazza delle Erbe Padova","a":"Mercado medieval bajo las arcadas de un majestuoso palacio Comunal del siglo XIII. El Palazzo della Ragione, del siglo XIII, tiene una de las grandes salas medievales de Europa, con techo de madera en forma de quilla de barco. Alrededor, la Piazza delle Erbe y la de la Frutta son mercado desde la Edad Media.","g":"","s0":0,"o":0,"i":["El gran Salone con la cubierta de barco invertida.","Construido en 1218 como sede de los tribunales de justicia y mercado cubierto en su planta baja.","La gran sala superior (Il Salone) posee el techo suspendido sin columnas más grande de Europa, cubierto por una gran bóveda de madera con forma de quilla de barco invertida. Sus muros están pintados con cientos de frescos astrológicos y medievales.","En el interior del Salone se conserva una gigantesca escultura de madera de un caballo del siglo XV inspirada en la estatua ecuestre del Gattamelata de Donatello.","Busca en el pavimento de la gran sala el meridiano grabado donde entra la luz del sol por un pequeño orificio de
