const T={I:['🔥','Ineludible'],O:['⭐','Opcional'],C:['🍽️','Comer'],L:['🚆','Logística']},XP={I:10,O:5,C:3,L:1},

function W(q){return memo[q]||(memo[q]=(async()=>{const k='w:'+q;try{const c=localStorage.getItem(k);if(c)return JSON.parse(c)}catch(e){}
try{const j=await (await fetch('https://es.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=3&gsrsearch='+encodeURIComponent(q)+'&prop=pageimages|extracts|info&inprop=url&piprop=thumbnail&pithumbsize=800&exintro=1&explaintext=1&exlimit=3')).json();
const p=Object.values(j.query.pages).sort((a,b)=>a.index-b.index),im=p.find(x=>x.thumbnail),ex=p.find(x=>x.extract&&x.extract.length>150),r={i:im&&im.thumbnail.source,x:ex&&ex.extract,u:ex&&ex.fullurl};
try{localStorage.setItem(k,JSON.stringify(r))}catch(e){}return r}catch(e){delete memo[q];return{}}})())}

if(e.target.id=='ov'||e.target.dataset.a=='x')return close();const b=e.target.closest('[data-a]');if(!b)return;
const c=b.closest('.card'),id=c.dataset.id,s=P[S.d].st.find(x=>x.id==id);
if(b.dataset.a=='i')info(s);if(b.dataset.a=='n')c.querySelector('textarea').classList.toggle('show');
if(b.dataset.a=='v'){S.v[id]=!S.v[id];if(S.v[id]){const r=b.getBoundingClientRect();boom(r.left+r.width/2,r.top)}else delete S.v[id];save();setTimeout(render,S.v[id]?450:0)}});
document.addEventListener('input',e=>{if(e.target.tagName!='TEXTAREA')return;const id=e.target.closest('.card').dataset.id;if(e.target.value)S.n[id]=e.target.value;else delete S.n[id];save()});
render();
</script></body></html>
