 la pared."],"v":"Mercado al aire libre bajo las arcadas del Palazzo della Ragione. El gran salón con frescos se visita (entrada de pago, consultad horario)."},{"k":"M","id":"d5x99","e":"🍽️","d":40,"at":0,"n":"Almuerzo: Tramezzini","a":"Sándwich de pan de molde blanco suave sin corteza, cortado en forma triangular y abundantemente rellenado en el centro hasta formar una curva pronunciada. Se sirven fríos con combinaciones como atún con huevo duro, pollo al curry o gambas con salsa rosa.","q":"Tramezzino"},{"k":"R","id":"d5r101","e":"🚗","n":"Padua → Venezia Mestre (entrega del coche)","d":30,"km":38,"at":0,"x":"Última conducción por la A4 hasta Venezia Mestre y entrega oficial del coche en la agencia (evitáis peajes y atascos urbanos).","tm":"","g":""},{"k":"R","id":"d5r102","e":"🚆","n":"Tren Mestre → Venezia Santa Lucia","d":15,"km":9,"at":0,"x":"Tren regional de ~10 min, ~1,45 €/p.","tm":"","g":"","u":"https://www.trenitalia.com"},{"k":"R","id":"d5r103","e":"⛴️","n":"BARCO: Vaporetto línea 1 por el Gran Canal","d":30,"km":5,"at":0,"x":"Embarque en el vaporetto (línea 1) por el Gran Canal hasta San Zaccaria / San Marco (~9,50 €/p). Los vaporetti son el transporte público: no hay otra opción.","tm":"","g":"","u":"https://actv.avmspa.it"},{"k":"R","id":"d5r104","e":"🏨","n":"Check-in cerca de San Marco 1925","d":30,"km":0,"at":0,"x":"Instalación en el alojamiento.","tm":"","g":""},{"k":"T","id":"d5x105","n":"Venecia","q":"Venezia canale","a":"Ciudad sobre 118 islas y más de 400 puentes, sin coches, patrimonio mundial. Se recorre a pie y en vaporetto. Perderse es parte del encanto: llevad el mapa descargado. Capital de una república marítima durante más de mil años, Venecia es un museo vivo. Se asienta sobre estacas de madera en una laguna. Los canales hacen de calles y el vaporetto es el transporte público.","pn":"La antigua Serenísima República de Venecia fue una potencia marítima y comercial dominante durante casi un milenio. Construida sobre un archipiélago de 118 islas unidas por puentes en medio de una laguna, su arquitectura gótica veneciana y su trazado urbano sin coches la convierten en una joya histórica y artística única en el mundo."},{"k":"S","id":"d5x106","n":"Piazza San Marco (Venecia)","z":"Venezia","p":[45.434,12.3388],"d":45,"q":"Piazza San Marco Venezia","a":"La gran plaza emblemática de la Serenísima, corazón público de Venecia. Basílica, Campanile y Palazzo Ducale; luego el Ponte dei Sospiri. Napoleón la llamó «el salón más hermoso de Europa». Es el punto más bajo de Venecia y la primera zona que se inunda con el acqua alta.","g":"","s0":0,"o":0,"i":["El gran salón de gala de la Serenísima.","Diseñada como el centro cívico y religioso del estado veneciano. Napoleón la calificó como \"el salón más elegante de Europa\".","Rodeada por las Procuradurías Viejas y Nuevas de estilo renacentista, el Museo Correr, el Campanario y la Basílica.","Es el punto más bajo de Venecia y el primero en inundarse durante las mareas altas conocidas como Acqua Alta.","Observa los dos mosaicos dorados bajo los arcos de las Procuradurías que reflejan los tonos del sol matutino."],"v":"Espacio público: acceso libre."},{"k":"S","id":"d5x107","n":"Ponte dei Sospiri (Puente de los Suspiros)","z":"Venezia","p":[45.4335,12.3406],"d":10,"q":"Ponte dei Sospiri","a":"Puente barroco de piedra de Istria que conectaba el palacio ducal con las prisiones. Puente cerrado de piedra de Istria que une el Palazzo Ducale con las antiguas prisiones. Se ve desde el Ponte della Paglia. Construido a principios del siglo XVII, el nombre romántico se popularizó en el siglo XIX por la imagen de los presos suspirando al ver la laguna por última vez.","g":"","s0":0,"o":0,"i":["El último suspiro de libertad sobre el canal.","Construido en 1600 para conectar el Palacio Ducal con las Nuevas Prisiones (Prigioni Nuove).","Puente cerrado de estilo barroco esculpido en piedra de Istria con celosías de piedra en sus ventanas.","Los \"suspiros\" no eran románticos, sino los lamentos de los prisioneros condenados al contemplar la laguna por última vez antes de ser encarcelados.","Si visitas el interior del Palacio Ducal, mira hacia el exterior a través de los pequeños calados de piedra de las ventanas del puente."],"v":"Espacio público: acceso libre."},{"k":"S","id":"d5x108","n":"Ponte di Rialto","z":"Venezia","p":[45.438,12.3359],"d":15,"q":"Ponte di Rialto Venezia","a":"El puente de piedra más antiguo sobre el Gran Canal, construido a finales del siglo XVI. Comercial desde la Edad Media. Mejor a primera hora o al atardecer. El puente de piedra actual se terminó hacia 1591; hasta entonces había uno de madera. Las tiendas que lo cubren son una tradición medieval.","g":"","s0":0,"o":0,"i":["El arco de piedra que abraza el Gran Canal.","Construido en piedra entre 1588 y 1591 por el arquitecto Antonio da Ponte para sustituir a un puente de madera previo que se derrumbó.","Puente de un solo arco de piedra de Istria que soporta dos hileras de tiendas inclinadas conectadas por una rampa central.","Grandes maestros como Miguel Ángel y Palladio presentaron proyectos para diseñarlo, pero fueron descartados en favor del diseño más funcional de Da Ponte.","Sitúate en la barandilla central del puente para obtener la vista clásica del Gran Canal con sus góndolas y vaporettos."],"v":"Espacio público: acceso libre."},{"k":"M","id":"d5x109","e":"🍽️","d":90,"at":1200,"n":"Cena: Risotto al nero di seppia","a":"Plato tradicional veneciano preparado con arroz de la región cocido con tinta natural de sepia, calamares frescos salteados, ajo, vino blanco y perejil, que le otorga su color negro intenso y profundo sabor a mar.","q":"Risotto al nero di seppia"}]},{"tl":"Venecia","n":6,"t":"Venecia: sestieres y góndola","e":"🎭","q":"Venezia San Marco","s":540,"h":{"Venezia":[45.4333,12.336]},"items":[{"k":"D","n":"Venecia"},{"k":"S","id":"d6x111","n":"Palazzo Ducale (Interior y Gran Sala)","z":"Venezia","p":[45.4336,12.3404],"d":100,"q":"Palazzo Ducale Venezia","a":"Recorrido interior por las estancias de poder y la Sala del Maggior Consiglio con el lienzo de Tintoretto.","g":"","s0":0,"o":0,"i":["La sede del Doge y el esplendor del Imperio Marítimo.","Sede del gobierno republicano y residencia oficial del Doge de Venecia desde el siglo IX.","Joya del gótico veneciano. La Sala del Maggior Consiglio es una de las salas no soportadas por columnas más grandes de Europa, presidida por la pintura monumental \"El Paraíso\" de Tintoretto.","Dos de las columnas del soportal exterior en la fachada de la plaza tienen un tono rosado distintivo; allí se leían públicamente las sentencias de muerte.","En la Sala del Gran Consejo, levanta la vista hacia el techo dorado para admirar los lienzos encastrados de Paolo Veronese."],"v":"Abierto 09:00–19:00. Entrada combinada de los Museos de San Marco ~30 €; reserva imprescindible.","u":"https://palazzoducale.visitmuve.it"},{"k":"S","id":"d6x112","n":"Puente de los suspiros","z":"Venezia","p":[45.4335,12.3406],"d":5,"q":"Ponte dei Sospiri","a":"Puente barroco de piedra de Istria visto desde dentro del Palacio Ducal. Se cruza dentro del recorrido del Palazzo Ducale, entre salas de justicia y celdas. Construido a principios del siglo XVII, conecta el palacio de justicia con las prisiones. El nombre romántico se popularizó en el siglo XIX.","g":"","s0":0,"o":0,"i":["El último suspiro de libertad sobre el canal.","Construido en 1600 para conectar el Palacio Ducal con las Nuevas Prisiones (Prigioni Nuove).","Puente cerrado de estilo barroco esculpido en piedra de Istria con celosías de piedra en sus ventanas.","Los \"suspiros\" no eran románticos, sino los lamentos de los prisioneros condenados al contemplar la laguna por última vez antes de ser encarcelados.","Si visitas el interior del Palacio Ducal, mira hacia el exterior a través de los pequeños calados de piedra de las ventanas del puente."],"v":"Espacio público: acceso libre."},{"k":"S","id":"d6x113","n":"Basílica de San Marcos (Interior y Pala d'Oro)","z":"Venezia","p":[45.4345,12.3397],"d":45,"q":"Basilica di San Marco Venezia","a":"Visita del espacio sagrado bizantino y su célebre retablo de piedras preciosas. La Iglesia de Oro: 5 cúpulas y 8.000 m² de mosaicos. Iniciada en 828 para custodiar las reliquias de San Marcos, su aspecto bizantino actual es del siglo XI. La Pala d'Oro es un retablo de oro y esmaltes con miles de piedras preciosas.","g":"","s0":0,"o":0,"i":["El tesoro dorado cubierto de mosaicos orientales.","Edificada a partir del siglo IX para albergar las reliquias de San Marcos traídas de Alejandría. Es la iglesia catedralicia de la ciudad.","Obra maestra bizantina con cinco cúpulas. Su interior alberga más de 8.000 metros cuadrados de mosaicos dorados y el retablo de orfebrería de la Pala d'Oro.","Muchas de sus columnas y esculturas fueron botín de guerra traído de Bizancio tras la Cuarta Cruzada en 1204.","Examina el brillo de los mosaicos dorados del techo bajo la iluminación interior para apreciar las teselas colocadas en ángulo oblicuo."],"v":"","u":"https://www.basilicasanmarco.it"},{"k":"S","id":"d6x114","n":"Campanile de San Marcos","z":"Venezia","p":[45.4339,12.3388],"d":25,"q":"Campanile di San Marco Venezia","a":"Torre campanario exenta de 99 metros de altura que domina la plaza. Reconstruido tras su derrumbe de 1902, el Campanile de San Marcos mide unos 99 m y era faro para los navegantes. Desde su cima se abarca toda la laguna y los tejados de Venecia.","g":"","s0":0,"o":0,"i":["El Paron de Venecia que domina la laguna.","La torre original se inició en el siglo IX y sirvió como faro y campanario. Se derrumbó por completo en 1902 y fue reconstruida \"tal como era y donde estaba\" en 1912.","Torre cuadrangular de ladrillo rojo de 98,6 metros coronada por una aguja piramidal con una estatua dorada del arcángel Gabriel.","Galileo Galilei utilizó este campanario en 1609 para presentar su telescopio a los señores del Senado veneciano.","En la cima, observa las cinco campanas originales; cada una tenía una función pública específica en la época de la República."],"v":"Mirador con ascensor sobre la laguna y los tejados. Entrada ~10 €."},{"k":"S","id":"d6x115","n":"Barrio de Castello","z":"Venezia","p":[45.4389,12.3466],"d":20,"q":"Castello sestiere Venezia","a":"El sestiere más extenso y auténtico de la ciudad, de ambiente residencial. Barrio tranquilo, lejos de las masas, con ropa tendida y canales estrechos. Castello es el sestiere más grande y menos turístico de Venecia, donde se conserva la Venecia cotidiana. Aquí estaba el Arsenal, motor de la flota veneciana.","g":"","s0":0,"o":0,"i":["La Venecia más auténtica entre ropa tendida y astilleros.","El distrito (sestiere) más extenso de Venecia, crecido alrededor del antiguo complejo naval del Arsenale desde el siglo XII.","Callejuelas estrechas, pequeñas plazas (campi) con pozos de piedra y la monumental basílica gótica de Santi Giovanni e Paolo.","En este barrio residían los trabajadores del astillero (arsenalotti), la élite obrera protegida directamente por el Doge.","Pasea por la Via Garibaldi, una de las pocas calles anchas de Venecia creada tras rellenar un antiguo canal en época napoleónica."],"v":"Espacio público: acceso libre."},{"k":"S","id":"d6x116","n":"Libreria Acqua Alta","z":"Venezia","p":[45.4389,12.3466],"d":15,"q":"Libreria Acqua Alta Venezia","a":"Librería pintoresca donde los libros se protegen del agua en góndolas, bañeras y piraguas. Hay una escalera hecha con libros con vistas al canal. Una de las librerías más fotogénicas del mundo: los libros se guardan en góndolas, bañeras y canoas para protegerlos de las inundaciones.","g":"","s0":0,"o":0,"i":["El laberinto literario donde los libros flotan.","Librería pintoresca creada para proteger colecciones de libros usados de las inundaciones periódicas de la laguna.","Espacio abarrotado donde los libros se organizan dentro de bañeras, canoas y una góndola a tamaño real.","En el patio trasero hay una escalera hecha enteramente con enciclopedias y libros viejos estropeados por el agua.","Sube por la escalera de libros gastados para obtener una vista sobre el canal posterior."],"v":"Entrada gratuita."},{"k":"M","id":"d6x117","e":"🍽️","d":40,"at":0,"n":"Almuerzo: Cicchetti","a":"La tradición del tapeo veneciano (andar a bacari). Pequeñas porciones servidas en barra: tostadas de pan con baccalà mantecato (bacalao desalado emulsionado con aceite), albóndigas de carne (polpette) o sardinas en escabeche con cebolla y pasas (sarde in saor), acompañados de una copa de vino (ombra).","q":"Cicchetti Venezia"},{"k":"S","id":"d6x118","n":"Ponte di Rialto","z":"Venezia","p":[45.438,12.3359],"d":15,"q":"Ponte di Rialto Venezia","a":"Zona comercial histórica y mercado tradicional de pescado y frutas a orillas del canal. Comercial desde la Edad Media. Mejor a primera hora o al atardecer. El puente de piedra actual se terminó hacia 1591; hasta entonces había uno de madera. Las tiendas que lo cubren son una tradición medieval.","g":"","s0":0,"o":0,"i":["El arco de piedra que abraza el Gran Canal.","Construido en piedra entre 1588 y 1591 por el arquitecto Antonio da Ponte para sustituir a un puente de madera previo que se derrumbó.","Puente de un solo arco de piedra de Istria que soporta dos hileras de tiendas inclinadas conectadas por una rampa central.","Grandes maestros como Miguel Ángel y Palladio presentaron proyectos para diseñarlo, pero fueron descartados en favor del diseño más funcional de Da Ponte.","Sitúate en la barandilla central del puente para obtener la vista clásica del Gran Canal con sus góndolas y vaporettos."],"v":"Espacio público: acceso libre."},{"k":"S","id":"d6x119","n":"Mercati de Rialto","z":"Venezia","p":[45.4407,12.3351],"d":20,"q":"Pescheria di Rialto Venezia||Rialto market Venice||Mercato di Rialto","a":"Zona comercial histórica y mercado tradicional de pescado y frutas. El mercado de pescado funciona por la mañana, de martes a sábado. Por la tarde se ven las terrazas y los bàcari de alrededor. Corazón comercial de la Serenísima desde la Edad Media. El mercado de pescado, la Pescheria, sigue funcionando en un edificio neogótico.","g":"","s0":0,"o":0,"i":["El espectáculo sensorial del pescado y la huerta de la laguna.","El centro neurálgico del comercio de víveres de Venecia desde hace casi mil años, situado junto al canal a pocos metros del puente de Rialto.","Destaca la Pescheria, una lonja neogótica abierta con arcos apuntados diseñada a principios del siglo XX por Domenico Rupolo.","Los capiteles de las columnas de la Pescheria muestran relieves de pececillos, cangrejos y criaturas marinas.","Fíjate en la placa de mármol en la pared de la lonja que detalla las medidas mínimas legales permitidas para la venta de cada pez desde la época veneciana."],"v":"Espacio público: acceso libre."},{"k":"S","id":"d6x120","n":"Gueto Judío de Venecia (Ghetto Ebraico)","z":"Venezia","p":[45.4455,12.3278],"d":45,"q":"Ghetto Ebraico Venezia","a":"El primer gueto segregado de la historia (1516), caracterizado por sus edificios altos de muchas plantas. En 1516 la República obligó a los judíos a vivir en esta isla de Cannaregio, cerrada con puertas por la noche. Como no había sitio, las casas crecieron en altura. De este lugar procede la palabra «gueto».","g":"","s0":0,"o":0,"i":["El primer gueto de la historia y refugio de culturas.","Establecido por decreto de la República en 1516 en el barrio de Cannaregio, aislando a la población judía durante las noches. Es el origen del término \"gueto\".","Se distingue por sus edificios inusualmente altos (de hasta 7 u 8 pisos) construidos para maximizar el espacio vertical, y sus sinagogas ocultas en los pisos superiores.","La palabra ghetto proviene del veneciano ghéto (fundición), ya que el barrio ocupaba el lugar de una antigua fábrica de cañones.","Busca en las fachadas los ventanales altos alineados de tres en tres que identifican exteriormente la presencia de las sinagogas interiores (scole)."],"v":"Paseo libre por el barrio. Museo y visitas guiadas a las sinagogas: de pago."},{"k":"S","id":"d6x121","n":"Fondaco dei Tredeschi (terraza)","z":"Venezia","p":[45.4385,12.3363],"d":25,"q":"Fondaco dei Tedeschi Venezia||T Fondaco dei Tedeschi terrazza||Fondaco dei Tedeschi","a":"Franjas horarias de 15 minutos. Antiguo almacén de comerciantes alemanes junto al Rialto, hoy centro comercial con terraza panorámica sobre los tejados y el Gran Canal.","g":"","s0":0,"o":1,"i":["El antiguo almacén de mercaderes con el mirador definitivo.","Edificio del siglo XIII reconstruido en el XVI que servía como almacén, aduana y alojamiento para los comerciantes alemanes en Venecia.","Palacio renacentista estructurado alrededor de un patio porticado central, transformado recientemente con una terraza mirador en su azotea.","Las fachadas exteriores estuvieron pintadas en su origen con frescos de Tiziano y Giorgione, perdidos por el clima húmedo de la laguna.","Desde la terraza de madera superior, contempla la curva en \"S\" perfecta que dibuja el Gran Canal a tus pies."],"v":"Terraza panorámica gratuita con reserva online obligatoria."},{"k":"S","id":"d6x122","n":"Dorsoduro y Santa Maria della Salute","z":"Venezia","p":[45.4307,12.3347],"d":45,"q":"Basilica di Santa Maria della Salute","a":"Barrio artístico y monumental dominado por la majestuosa iglesia barroca dedicada a la Salud. Barrio de artistas y galerías, con la Accademia y la colección Peggy Guggenheim. La Salute, obra de Baldassare Longhena, se levantó como ofrenda tras la peste de 1630.","g":"","s0":0,"o":0,"i":["La corona barroca a la entrada del Gran Canal.","La basílica fue erigida a partir de 1631 como exvoto de la ciudad tras una epidemia de peste que acabó con un tercio de la población.","Obra maestra del barroco veneciano diseñada por Baldassarre Longhena. Edificio octogonal cubierto por una cúpula sostenida por grandes volutas o contrafuertes con forma de espiral.","Los cimientos de la iglesia requirieron clavar en el barro de la laguna más de 1.000.000 de postes de madera de alerce.","Observa las enormes esculturas de profetas colocadas sobre las volutas espirales que decoran el exterior de la cúpula."],"v":"Paseo libre. Basílica de la Salute: entrada libre (sacristía de pago)."},{"k":"S","id":"d6x123","n":"Squero di San Trovaso","z":"Venezia","p":[45.4289,12.3253],"d":15,"q":"Squero di San Trovaso Venezia","a":"Taller y astillero tradicional activo desde el siglo XVII para la construcción y reparación de góndolas. Astillero donde aún se hacen góndolas a mano. Uno de los pocos astilleros de góndolas que siguen funcionando en Venecia, en Dorsoduro y del siglo XVII. Sus casetas de madera recuerdan a chalés de montaña. No se puede entrar: la mejor vista es desde la Fondamenta Nani, al otro lado del canal.","g":"","s0":0,"o":0,"i":["El último astillero tradicional de góndolas.","Taller en funcionamiento desde el siglo XVII dedicado a la construcción y reparación artesanal de las góndolas venecianas.","Edificio de madera cuya arquitectura recuerda a una casa de montaña o alpina, algo inusual en Venecia.","Los carpinteros originarios del Cadore (zona alpina) construyeron la nave con la madera y el estilo propio de sus montañas natales.","Desde el lado opuesto del canal, observa cómo las góndolas descansan inclinadas sobre la rampa de madera para su reparación."],"v":"Espacio público: acceso libre."},{"k":"S","id":"d6x124","n":"paseo en góndola","z":"Venezia","p":[45.435,12.333],"d":40,"q":"Gondola Venezia canale||Gondola Venice||Gondolier Venice","a":"Paseo clásico de 30 minutos por canales secundarios y un tramo del Gran Canal. La góndola es una embarcación asimétrica de unos 11 m, hecha con varias maderas y con el remo apoyado en la forcola. Por los canales secundarios el paseo es más tranquilo y se ven los palacios desde el agua.","g":"","s0":0,"o":0,"i":["El símbolo flotante de Venecia.","La góndola es la embarcación tradicional de la laguna, usada durante siglos como medio de transporte de la nobleza y los vecinos. Hoy, con el vaporetto y los barcos a motor, su uso es sobre todo turístico y ceremonial.","Es una barca asimétrica de unos 11 metros, negra, de fondo plano, que se gobierna con un solo remo apoyado en la forcola, una pieza de madera tallada. Su asimetría compensa el empuje del remero a un solo lado.","Los gondoleros forman un gremio muy cerrado y se necesita una licencia para ejercer. El peine de hierro de la proa (el ferro) tiene seis púas que recuerdan los seis sestieres.","Fíjate en la forcola, la pieza de madera donde se apoya el remo: cada gondolero tiene una forma propia, casi escultórica."],"v":"Tarifa oficial: 90 € por góndola de día (hasta 5 personas), para vuestro grupo de 4."},{"k":"M","id":"d6x125","e":"🍽️","d":90,"at":1200,"n":"Cena: Risotto al nero di seppia","a":"Plato tradicional veneciano preparado con arroz de la región cocido con tinta natural de sepia, calamares frescos salteados, ajo, vino blanco y perejil, que le otorga su color negro intenso y profundo sabor a mar.","q":"Risotto al nero di seppia"}]},{"tl":"Venecia","n":7,"t":"Venecia: despedida","e":"✈️","q":"Venezia Murano","s":510,"h":{"Venezia":[45.4333,12.336]},"items":[{"k":"D","n":"Venecia"},{"k":"R","id":"d7r128","e":"⛴️","n":"BARCO: San Zaccaria → Murano (Opción A)","d":30,"km":4,"at":510,"x":"Vaporetto desde San Zaccaria a las 08:30.","tm":"","g":"A","u":"https://actv.avmspa.it"},{"k":"S","id":"d7x129","n":"Isla de Murano","z":"Murano","p":[45.4573,12.353],"d":60,"q":"Murano","a":"Isla famosa mundialmente por la tradición centenaria del soplado artesanal de vidrio. Los hornos de vidrio se trasladaron aquí en 1291. Visita a una fornace con demostración en vivo. En 1291 la República ordenó trasladar los hornos a Murano por riesgo de incendio y para proteger sus secretos. Hoy el Museo del Vidrio y las fornaci enseñan el soplado.","g":"A","s0":0,"o":0,"i":["La isla del fuego y el vidrio milenario.","En 1291, la República de Venecia ordenó trasladar todos los hornos de vidrio de la ciudad a Murano para evitar incendios en las casas de madera.","Isla surcada por canales con casas de artesanos y la Basílica de Santa María y San Donato, famosa por sus mosaicos románicos.","Los maestros vidrieros de Murano tenían prohibido abandonar la República bajo pena de muerte para evitar que divulgaran los secretos de la fabricación del cristal.","Asiste a un taller para ver el modelado en vivo del vidrio mediante soplado a altas temperaturas."],"v":"Isla de paseo libre. Los museos y algunas demostraciones de vidrio cobran aparte."},{"k":"R","id":"d7r131","e":"⛴️","n":"BARCO: Murano → Burano (Opción A)","d":30,"km":6,"at":0,"x":"Vaporetto de Murano a Burano (línea 12 desde Murano Faro, ~30 min). Comprobad horarios en el embarcadero.","tm":"","g":"A","u":"https://actv.avmspa.it"},{"k":"S","id":"d7x130","n":"Isla de Burano","z":"Burano","p":[45.4854,12.4167],"d":45,"q":"Burano","a":"Isla célebre por sus casas de colores vivos y la elaboración tradicional de encajes. Casas pintadas en rojo, azul y amarillo. Mejor sin prisa, con fotos y un helado. Burano es famosa por sus casas de colores y por el encaje que las mujeres de la isla trabajaban a mano. Hay que tomarse el tiempo de pasear por sus canales.","g":"A","s0":0,"o":0,"i":["El lienzo de fachadas de colores y encajes finos.","Isla de pescadores famosa internacionalmente desde el siglo XVI por la elaboración artesanal de encaje de aguja (merletto).","Destaca por sus hileras de casas pintadas con colores vivos y saturados (azules, rosas, amarillos) y el campanario inclinado de la iglesia de San Martino.","Según la tradición, las casas se pintaban con colores brillantes para que los pescadores pudieran identificarlas a lo lejos en los días de densa niebla.","Busca la esquina con el canal cerca de la Piazza Galuppi para fotografiar el campanario visiblemente inclinado detrás de las fachadas polícromas."],"v":"Isla de paseo libre."},{"k":"R","id":"d7r132","e":"⛴️","n":"BARCO: Burano → San Zaccaria (Opción A)","d":50,"km":10,"at":0,"x":"Vuelta en vaporetto a San Zaccaria (~50 min; comprobad la línea en el embarcadero). Llegada hacia el mediodía para almorzar y recoger las maletas.","tm":"","g":"A","u":"https://actv.avmspa.it"},{"k":"S","id":"d7x133","n":"Scala Contarini del Bovolo","z":"Venezia","p":[45.4343,12.3333],"d":30,"q":"Scala Contarini del Bovolo Venezia","a":"Escalera helicoidal exterior gótico-renacentista adosada a un palacio escondido. Pequeño tesoro escondido. Esta torre con escalera de caracol exterior pertenece al palacio Contarini. Se construyó hacia 1499 y desde arriba hay una vista curiosa sobre los tejados de San Marco.","g":"B","s0":0,"o":0,"i":["La caracola de arcos y mármol escondida en el callejón.","Añadida a finales del siglo XV al palacio de la familia Contarini para darle una fachada de gala y prestigio.","Torre cilíndrica exenta decorada con arquerías en espiral que combinan los estilos gótico veneciano y renacentista.","La palabra bovolo significa caracol en dialecto veneciano, haciendo referencia directa a la escalera helicoidal interior.","Sube los 80 escalones en espiral para disfrutar de una vista sobre los tejados venecianos y las cúpulas de San Marcos."],"v":"Entrada ~8 €, vistas desde lo alto."},{"k":"S","id":"d7x134","n":"Riva degli Schiavoni y Arsenale","z":"Venezia","p":[45.4337,12.347],"d":60,"q":"Riva degli Schiavoni Arsenale Venezia","a":"Gran paseo marítimo que conduce al histórico astillero y complejo militar preindustrial. Arsenal naval más grande del s. XVI: montaba una galera en un día. La Riva es el paseo marítimo que sale del Palazzo Ducale hacia el este. Más allá, el Arsenale fue el astillero de la República, capaz de armar una galera en una jornada gracias a su cadena de montaje.","g":"B","s0":0,"o":0,"i":["El paseo marítimo de la guardia y la cuna naval.","La Riva era el muelle donde atracaban los barcos de mercancías procedentes de Eslovenia y Dalmacia (Schiavonia). El Arsenale fue el corazón militar e industrial de la flota veneciana.","Amplio paseo marítimo de piedra de Istria. La puerta del Arsenale (Porta Magna) es considerada el primer ejemplo de arquitectura renacentista en Venecia.","En el siglo XVI, el Arsenale empleaba a más de 16.000 trabajadores y era capaz de ensamblar y botar una galera de guerra en un solo día.","Contempla los dos leones de piedra antiguos que custodian la portada triunfal de entrada al Arsenale."],"v":"Espacio público: acceso libre."},{"k":"M","id":"d7x135","e":"🍽️","d":40,"at":0,"n":"Almuerzo: Tramezzini","a":"Sándwich de pan de molde blanco suave sin corteza, cortado en forma triangular y abundantemente rellenado en el centro hasta formar una curva pronunciada. Se sirven fríos con combinaciones como atún con huevo duro, pollo al curry o gambas con salsa rosa.","q":"Tramezzino"},{"k":"R","id":"d7r137","e":"⛴️","n":"BARCO: Alilaguna San Zaccaria → Aeropuerto de Venecia","d":75,"km":14,"at":840,"x":"Alilaguna (Línea Azul / Roja): embarque directo en San Zaccaria, a 3 min a pie del alojamiento. Travesía por la laguna hasta la terminal en ~1 h 15 min (~15 €/p). Recoged las maletas antes.","tm":"","g":"","u":"https://www.alilaguna.it"},{"k":"R","id":"d7r138","e":"✈️","n":"Venecia (VCE) → Sevilla (SVQ)","d":0,"km":0,"at":0,"x":"Vuelo de vuelta. Revisad hora y terminal en la tarjeta de embarque.","tm":"Tarde","g":""}]}];
